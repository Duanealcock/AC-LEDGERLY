function recalcJournalForm(){
  const rows = document.querySelectorAll('#je-body tr');
  let debit=0, credit=0;
  rows.forEach(r=>{
    debit += Number(r.querySelector('.je-debit').value)||0;
    credit += Number(r.querySelector('.je-credit').value)||0;
  });
  const diff = round2(debit-credit);
  if(document.getElementById('je-sum-debit')) document.getElementById('je-sum-debit').textContent = fmt(debit);
  if(document.getElementById('je-sum-credit')) document.getElementById('je-sum-credit').textContent = fmt(credit);
  const diffEl = document.getElementById('je-sum-diff');
  const labelEl = document.getElementById('je-balance-label');
  if(diffEl){
    diffEl.textContent = fmt(Math.abs(diff));
    diffEl.className = 'num ' + (Math.abs(diff)<0.005 ? 'pos' : 'neg');
    labelEl.textContent = Math.abs(diff)<0.005 ? 'Balanced ✓' : 'Out of balance by';
  }
}
function submitJournalEntryForm(){
  const date = document.getElementById('je-date').value;
  const desc = document.getElementById('je-desc').value.trim();
  if(!date){ showToast('Choose a date'); return; }
  if(!desc){ showToast('Enter a description'); return; }
  const rows = document.querySelectorAll('#je-body tr');
  const lines = [];
  rows.forEach(r=>{
    const accountId = r.querySelector('.je-acct').value;
    const debit = Number(r.querySelector('.je-debit').value)||0;
    const credit = Number(r.querySelector('.je-credit').value)||0;
    if(debit>0 || credit>0) lines.push({accountId, debit, credit});
  });
  if(lines.length<2){ showToast('Add at least two lines'); return; }
  const totalDebit = lines.reduce((s,l)=>s+l.debit,0);
  const totalCredit = lines.reduce((s,l)=>s+l.credit,0);
  if(Math.abs(round2(totalDebit-totalCredit))>0.004){ showToast('Debits and credits must balance before posting'); return; }

  entry.manual = true;
  entry.ref = 'manual-'+entry.id;
  if(isOpening) entry.isOpeningBalance = true;
  closeModal(); showToast(isOpening? 'Opening balance entry posted' : 'Journal entry posted'); navigate('journal');

/* ============================= CASHBOOK (quick-capture grid) ============================= */
let CASHBOOK_ACCOUNT = null;
function blankCashbookRow(accountId){
  return { id:uid('cb'), accountId, date:todayStr(), payee:'', description:'', type:'account',
    accountSelection:null, contactSelection:null, matchDocId:null, reference:'',
    vatRate:0, spent:0, received:0 };
}
function insertCashbookRow(){
  if(!CASHBOOK_ACCOUNT){ showToast('Add a bank account first'); return; }
  S.cashbookDrafts = S.cashbookDrafts || [];
  S.cashbookDrafts.push(blankCashbookRow(CASHBOOK_ACCOUNT));
  saveState(true);
  renderCashbook();
}
function updateCashbookField(id, field, value){
  const row = (S.cashbookDrafts||[]).find(r=>r.id===id);
  if(!row) return;
  // block edits if the row's date (current or the new value) falls in a closed VAT period
  const effDate = field==='date' ? value : row.date;
  if(isDateInClosedVatPeriod(row.date) || (field==='date' && isDateInClosedVatPeriod(value))){
    showToast('That date is in a closed VAT period — reopen the period to edit'); renderCashbook(); return;
  }
  row[field] = value;
  saveState();
}
function setCashbookAmount(id, field, value, inputEl){
  const row = (S.cashbookDrafts||[]).find(r=>r.id===id);
  if(!row) return;
  if(isDateInClosedVatPeriod(row.date)){ showToast('That date is in a closed VAT period — reopen the period to edit'); renderCashbook(); return; }
  const v = Number(value)||0;
  row[field] = v;
  const otherField = field==='spent' ? 'received' : 'spent';
  if(v>0 && row[otherField]>0){
    row[otherField] = 0;
    const tr = inputEl.closest('tr');
    const otherInput = tr && tr.querySelector(field==='spent' ? '.cb-received' : '.cb-spent');
    if(otherInput) otherInput.value = '';
    // Selection cell depends on in/out direction for account-type rows — refresh it
    if(row.type==='account'){ renderCashbook(); return; }
  }
  saveState();
}
function deleteCashbookRow(id){
  const row = (S.cashbookDrafts||[]).find(r=>r.id===id);
  if(row && isDateInClosedVatPeriod(row.date)){ showToast('That date is in a closed VAT period — reopen the period to delete'); return; }
  S.cashbookDrafts = (S.cashbookDrafts||[]).filter(r=>r.id!==id);
  saveState(true);
  renderCashbook();
}
function postCashbookRow(row){
  const gross = row.spent>0 ? row.spent : row.received;
  const isIn = row.received>0;
  if(!row.date) return {ok:false, msg:'Enter a date'};
  if(isDateInClosedVatPeriod(row.date)) return {ok:false, msg:'Date is in a closed VAT period — reopen it first'};
  if(!gross || gross<=0) return {ok:false, msg:'Enter a Spent or Received amount'};
  const desc = (row.description||row.payee||'Cashbook entry') + (row.reference? ' — '+row.reference : '');
  const cashbookRef = 'cb-'+uid('r');
  // snapshot for the Reviewed tab (so we can display + undo later)
  const meta = {
    cashbookRef, source:'cashbook', accountId:row.accountId, date:row.date,
    payee:row.payee||'', description:row.description||'', reference:row.reference||'',
    type:row.type, accountSelection:row.accountSelection||null,
    contactSelection:row.contactSelection||null, matchDocId:row.matchDocId||null,
    vatRate:row.vatRate||0, spent:row.spent||0, received:row.received||0,
  };

  if(row.type==='contact'){
    if(!row.matchDocId) return {ok:false, msg:'Select an invoice or bill to allocate this to'};
    if(isIn) recordInvoicePayment(row.matchDocId, gross, row.date, row.accountId, cashbookRef);
    else recordBillPayment(row.matchDocId, gross, row.date, row.accountId, cashbookRef);
    // tag the payment's journal entry(ies) so they show under Reviewed
    S.journal.filter(e=>e.ref===cashbookRef).forEach(e=>{ e.cashbookMeta = meta; });
    S.cashbookReviewed = S.cashbookReviewed || [];
    S.cashbookReviewed.push(meta);
    return {ok:true};
  }
  const catId = row.accountSelection || (isIn ? 'acc_unalloc_inc' : 'acc_unalloc_exp');
  const useVat = row.vatRate>0;
  const net = useVat ? round2(gross/(1+row.vatRate/100)) : gross;
  const tax = round2(gross-net);
  const lines = [];
  if(isIn){
    lines.push({accountId:row.accountId, debit:gross, credit:0});
    lines.push({accountId:catId, debit:0, credit:net});
    if(tax>0) lines.push({accountId:'acc_vatp', debit:0, credit:tax});
  } else {
    lines.push({accountId:catId, debit:net, credit:0});
    if(tax>0) lines.push({accountId:'acc_vatr', debit:tax, credit:0});
    lines.push({accountId:row.accountId, debit:0, credit:gross});
  }
  const entry = postJournal(desc, row.date, lines);
  entry.ref = cashbookRef;
  entry.cashbookMeta = meta;
  S.cashbookReviewed = S.cashbookReviewed || [];
  S.cashbookReviewed.push(meta);
  return {ok:true};
}
function commitCashbookRow(id){
  const row = (S.cashbookDrafts||[]).find(r=>r.id===id);
  if(!row) return;
  const result = postCashbookRow(row);
  if(!result.ok){ showToast(result.msg); return; }
  S.cashbookDrafts = S.cashbookDrafts.filter(r=>r.id!==id);
  showToast('Transaction added to the books');
  saveState(true);
  renderCashbook();
}
function addAllCashbookRows(){
  const rows = (S.cashbookDrafts||[]).filter(r=>r.accountId===CASHBOOK_ACCOUNT);
  if(!rows.length){ showToast('No rows to add'); return; }
  const succeededIds = [];
  let skipped = 0;
  rows.forEach(row=>{
    const result = postCashbookRow(row);
    if(result.ok) succeededIds.push(row.id); else skipped++;
  });
  S.cashbookDrafts = S.cashbookDrafts.filter(r=>!succeededIds.includes(r.id));
  showToast(`${succeededIds.length} added${skipped? `, ${skipped} skipped (missing info)`:''}`);
  saveState(true);
  renderCashbook();
}
function cashbookSelectionCell(r){
  if(r.type==='contact'){

    return `
      <select onchange="updateCashbookField('${r.id}','contactSelection',this.value); updateCashbookField('${r.id}','matchDocId',null); renderCashbook();" style="margin-bottom:4px;">
        <option value="">Select ${isIn?'customer':'supplier'}…</option>
        ${contacts.map(c=>`<option value="${c.id}" ${c.id===r.contactSelection?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      ${r.contactSelection? `<select onchange="updateCashbookField('${r.id}','matchDocId',this.value)">
        <option value="">Select ${isIn?'invoice':'bill'}…</option>
        ${openDocs.map(d=>`<option value="${d.id}" ${d.id===r.matchDocId?'selected':''}>${d.number} (${fmt(docBalanceDue(d))} due)</option>`).join('')}
      </select>` : (r.contactSelection!==null && contacts.length===0 ? `<div class="hint" style="margin:0;">No ${isIn?'customers':'suppliers'} yet</div>` : '')}
    `;
  }
  const isIn = r.received>0;
  const value = r.accountSelection;
  const defaultLabel = isIn ? 'Unallocated Income' : 'Unallocated Expense';
  return `<select onchange="updateCashbookField('${r.id}','accountSelection',this.value)" style="${!value?'color:var(--gold); font-weight:600;':''}">
    <option value="" ${!value?'selected':''}>${defaultLabel}</option>
    ${accountOptionsHtml(value)}
  </select>`;
}
function cashbookRowHtml(r){
  const locked = isDateInClosedVatPeriod(r.date);
  if(locked){
    // read-only, locked row — no editable inputs, lock icon instead of the tick
    const sel = selectionLabel(r);
    return `<tr data-id="${r.id}" class="cb-locked-row" title="Locked — dated in a closed VAT period">
      <td style="text-align:center;"><span class="cb-lock" title="Locked — in a closed VAT period">🔒</span></td>
      <td>${fmtDateShort(r.date)}</td>
      <td>${escapeHtml(r.payee||'—')}</td>
      <td>${escapeHtml(r.description||'—')}</td>
      <td>${r.type==='contact'?'Contact':'Account'}</td>
      <td>${sel}</td>

  const size = CASHBOOK_PAGE_SIZE[tab];

  CASHBOOK_PAGE[tab] = page;
  if(pages<=1) return '';
  const from = (page-1)*size + 1;
  const to = Math.min(total, page*size);
  // build a compact page-number list (first, current-1..current+1, last, with … gaps)
  const nums = [];
  const add = n => { if(!nums.includes(n) && n>=1 && n<=pages) nums.push(n); };
  add(1); add(2); add(page-1); add(page); add(page+1); add(pages-1); add(pages);
  nums.sort((a,b)=>a-b);
  let btns = '';
  let prev = 0;
  nums.forEach(n=>{
    if(prev && n-prev>1) btns += `<span style="padding:0 4px; color:var(--text-muted);">…</span>`;
    btns += `<button class="cb-page-btn ${n===page?'active':''}" onclick="setCashbookPage('${tab}', ${n})">${n}</button>`;

function undoReviewedCashbook(cashbookRef, silent){
  const meta = (S.cashbookReviewed||[]).find(m=>m.cashbookRef===cashbookRef);
  if(!meta) return;
  if(isDateInClosedVatPeriod(meta.date)){ if(!silent) showToast('That transaction is in a closed VAT period — reopen the period to move it'); return; }
  if(!silent && !confirm('Undo this reviewed transaction? It will be reversed out of the books and returned to New Transactions.')) return;
  // If it was a contact allocation, remove the payment record from the target doc
  if(meta.type==='contact' && meta.matchDocId){
    const isIn = meta.received>0;
    const doc = (isIn?S.invoices:S.bills).find(d=>d.id===meta.matchDocId);
    if(doc && doc.payments){
      doc.payments = doc.payments.filter(p=>p.journalRef!==cashbookRef);
    }
  }
  // remove the journal entry/entries tagged with this ref (this cleanly backs the posting out of all balances)
  S.journal = S.journal.filter(e=> e.ref!==cashbookRef);
  // restore as a draft row for re-allocation
  S.cashbookDrafts = S.cashbookDrafts || [];
  S.cashbookDrafts.push({
    id:uid('cb'), accountId:meta.accountId, date:meta.date, payee:meta.payee||'', description:meta.description||'',
    type:meta.type, accountSelection:meta.accountSelection||null, contactSelection:meta.contactSelection||null,
    matchDocId:meta.matchDocId||null, reference:meta.reference||'', vatRate:meta.vatRate||0,
    spent:meta.spent||0, received:meta.received||0,
  });
  S.cashbookReviewed = S.cashbookReviewed.filter(m=>m.cashbookRef!==cashbookRef);
  if(!silent){
    CASHBOOK_TAB = 'new';
    showToast('Transaction reversed and returned to New Transactions');
    saveState(true);
    renderCashbook();
  }
}

  supplier: { periodMode:'all', from:'', to:'', agingAsOf:'', agingBasis:'due', includeZero:false, ran:{statement:false, aging:false} },

function daysBetween(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }

// Aging buckets for a set of docs as of a date, keyed off due date or document date.
function agingForDocs(cdocs, asOf, basis){
  const b = {current:0, d30:0, d60:0, d90:0, total:0};
  cdocs.forEach(d=>{
    const bal = docBalanceDue(d);
    if(bal<=0) return;
    const refDate = (basis==='invoice') ? d.date : (d.dueDate || d.date);
    const overdueDays = refDate ? daysBetween(refDate, asOf) : 0;
    if(overdueDays<=0) b.current+=bal;
    else if(overdueDays<=30) b.d30+=bal;
    else if(overdueDays<=60) b.d60+=bal;
    else b.d90+=bal;
    b.total+=bal;
  });
  return b;
}

// Build a running statement of documents + payments for one contact, chronologically.
function buildStatement(contact, kind, fromDate, toDate){
  const isCust = kind==='customer';
  const docs = (isCust ? S.invoices : S.bills).filter(d=>d.contactId===contact.id && d.status!=='draft' && docStatus(d)!=='void');
  const cns = (isCust ? S.creditNotes : S.suppCreditNotes).filter(c=>c.contactId===contact.id && c.status!=='draft' && docStatus(c)!=='void');
  const totalOf = isCust ? invoiceTotal : billTotal;
  const events = [];
  docs.forEach(d=>{
    events.push({date:d.date, ref:d.number, type:isCust?'Invoice':'Bill', charge:totalOf(d), credit:0, sort:d.date+'-1'});
    (d.payments||[]).forEach(p=>{
      const isCreditAlloc = !!p.creditNoteId;
      events.push({date:p.date, ref:p.memo|| (isCust?'Receipt':'Payment'), type:isCreditAlloc?'Credit applied':(isCust?'Payment received':'Payment made'), charge:0, credit:p.amount, sort:p.date+'-2'});
    });
  });
  cns.forEach(c=>{
    // standalone credit notes (not allocated) show as a credit line
    if(!c.appliesToId){
      events.push({date:c.date, ref:c.number, type:'Credit note', charge:0, credit:creditNoteTotal(c), sort:c.date+'-1'});
    }
  });
  events.sort((a,b)=> a.date.localeCompare(b.date) || a.sort.localeCompare(b.sort));
  let running=0, openingBalance=0;
  const rows=[];
  events.forEach(e=>{
    const inRange = (!fromDate || e.date>=fromDate) && (!toDate || e.date<=toDate);
    running += e.charge - e.credit;
    if(fromDate && e.date < fromDate){ openingBalance = running; return; }
    if(inRange) rows.push({...e, balance:running});
  });
  return {rows, openingBalance, closingBalance:running};
}

          <span class="doc-tile-count">${creditNoteCollection(kind).filter(c=>docStatus(c)!=='void').length}</span>
        </button>
      </div>`;
    bodyHtml = submenu + `
      <div class="card">
        <div class="card-head"><h3>Recent ${docLabel.toLowerCase()} — all ${label.toLowerCase()}</h3>
          <button class="btn btn-ghost btn-sm" onclick="navigate('${taxInvoiceView}')">Open ${isCust?'Sales':'Purchases'}</button></div>
        ${rows.length? `<table><thead><tr><th>${isCust?'Invoice':'Bill'}</th><th>${singular}</th><th>Date</th><th>Due</th><th class="amt">Total</th><th class="amt">Balance</th><th>Status</th></tr></thead><tbody>
          ${rows.map(d=>`<tr class="clickable" onclick="${isCust?`openInvoiceDetail('${d.id}')`:`openBillDetail('${d.id}')`}">

function contactReportsSubmenu(kind, active){

function renderContactReports(kind, list, docs, totalOf, isCust, label, singular, docLabel){
  const view = CONTACT_REPORT_VIEW || 'balances';
  const submenu = contactReportsSubmenu(kind, view);

  // ---- BALANCES (original summary) ----
  if(view==='balances'){
    const rowsData = list.map(c=>{
      const cdocs = docs.filter(d=>d.contactId===c.id && docStatus(d)!=='void' && d.status!=='draft');

      const paid = cdocs.reduce((s,d)=>s+docPaidAmount(d),0);
      const due = cdocs.reduce((s,d)=>s+docBalanceDue(d),0);
      const overdue = cdocs.filter(d=>docBalanceDue(d)>0 && d.dueDate && d.dueDate < todayStr()).reduce((s,d)=>s+docBalanceDue(d),0);
      return {c, count:cdocs.length, total, paid, due, overdue};
    }).filter(r=>r.count>0);
    const grand = rowsData.reduce((a,r)=>({total:a.total+r.total, paid:a.paid+r.paid, due:a.due+r.due, overdue:a.overdue+r.overdue}), {total:0,paid:0,due:0,overdue:0});

function runContactReport(kind, which){
  const p = reportParams(kind);
  if(which==='statement'){
    const sel = document.getElementById('rp-contact'); if(sel) CONTACT_REPORT_ID = sel.value;
    const per = document.getElementById('rp-period'); if(per) p.periodMode = per.value;
    const f = document.getElementById('rp-from'); const t = document.getElementById('rp-to');
    if(f) p.from = f.value; if(t) p.to = t.value;
    p.ran.statement = true;
  } else {
    const sel = document.getElementById('rp-contact'); if(sel) p.contactId = sel.value;
    const asof = document.getElementById('rp-asof'); if(asof) p.agingAsOf = asof.value;
    const basis = document.getElementById('rp-basis'); if(basis) p.agingBasis = basis.value;
    const zero = document.getElementById('rp-zero'); if(zero) p.includeZero = zero.checked;
    p.ran.aging = true;
  }
  navigate(kind==='customer'?'cust-reports':'supp-reports');
}
// Turn a period mode + custom dates into concrete from/to
function resolvePeriod(p){
  const today = todayStr();
  const y = today.slice(0,4), m = today.slice(5,7);
  switch(p.periodMode){
    case 'ytd': return {from:`${y}-01-01`, to:today};
    case 'this-month': return {from:`${y}-${m}-01`, to:today};
    case 'last-month': {
      const d = new Date(today+'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth()-1);
      const from = d.toISOString().slice(0,10);
      const end = new Date(today+'T00:00:00'); end.setDate(0); // last day of prev month
      return {from, to:end.toISOString().slice(0,10)};
    }
    case 'last-30': { const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-30); return {from:d.toISOString().slice(0,10), to:today}; }
    case 'last-90': { const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-90); return {from:d.toISOString().slice(0,10), to:today}; }
    case 'custom': return {from:p.from||'', to:p.to||''};
    default: return {from:'', to:''};
  }
}

/* ============================= FINANCIAL YEAR ============================= */
// ACTIVE_FY is the label year of the financial year currently being worked on.
// A financial year is labelled by the calendar year in which it ENDS.
// e.g. fyStartMonth=3 (March): FY2026 = 01 Mar 2025 – 28/29 Feb 2026.
let ACTIVE_FY = null; // number, or null = "All years"
// FY start is defined by the configured start date's month & day (repeating each year).
// Falls back to fyStartMonth (day 1) for older data without dates.
function fyStartMonth(){
  if(S.settings.fyStartDate){ return parseInt(S.settings.fyStartDate.slice(5,7),10); }
  const m = S.settings.fyStartMonth; return (m>=1 && m<=12) ? m : 3;
}
function fyStartDay(){
  if(S.settings.fyStartDate){ return parseInt(S.settings.fyStartDate.slice(8,10),10); }
  return 1;
}
// Returns {from,to} ISO dates for the financial year that ENDS in labelYear,
// repeating the configured start month-day pattern.
function fyBounds(labelYear){
  const sm = fyStartMonth(), sd = fyStartDay();
  // Start year is labelYear-1 unless the year starts on 1 Jan (then it's labelYear).
  const startsJan1 = (sm===1 && sd===1);
  const startYear = startsJan1 ? labelYear : labelYear-1;
  const from = `${startYear}-${String(sm).padStart(2,'0')}-${String(sd).padStart(2,'0')}`;
  // End is the day before the next start (start date in labelYear, minus one day).
  const nextStart = new Date(`${labelYear}-${String(sm).padStart(2,'0')}-${String(sd).padStart(2,'0')}T00:00:00`);
  nextStart.setDate(nextStart.getDate()-1);
  return {from, to:nextStart.toISOString().slice(0,10)};
}
// Which financial-year label does a given ISO date fall into?
function fyOfDate(date){
  const sm = fyStartMonth(), sd = fyStartDay();
  const y = parseInt(date.slice(0,4),10);
  const startsJan1 = (sm===1 && sd===1);
  if(startsJan1) return y;
  // if the date is on/after this year's start date, it belongs to FY(y+1), else FY(y)
  const thisYearStart = `${y}-${String(sm).padStart(2,'0')}-${String(sd).padStart(2,'0')}`;
  return date >= thisYearStart ? y+1 : y;
}
// The FY label for today.
function currentFyLabel(){ return fyOfDate(todayStr()); }
// Suggested date-picker defaults when the user hasn't set them yet.
function defaultFyStartValue(){
  const cur = currentFyLabel();
  return fyBounds(cur).from;
}
function defaultFyCloseValue(){
  const cur = currentFyLabel();
  return fyBounds(cur).to;
}
// All FY labels that have activity, plus a sensible window around today.
function availableFyLabels(){
  const labels = new Set();
  const push = d => { if(d) labels.add(fyOfDate(d)); };
  (S.journal||[]).forEach(e=>push(e.date));
  (S.invoices||[]).forEach(d=>push(d.date));
  (S.bills||[]).forEach(d=>push(d.date));
  const cur = currentFyLabel();
  // always offer current and a couple on either side
  for(let y=cur-2; y<=cur+1; y++) labels.add(y);
  return Array.from(labels).filter(Boolean).sort((a,b)=>b-a);
}
// Active FY bounds, or null when "All years".
function activeFyBounds(){ return ACTIVE_FY==null ? null : fyBounds(ACTIVE_FY); }
function fyLabelText(labelYear){
  const b = fyBounds(labelYear);
  return `FY${labelYear} (${fmtDateShort(b.from)} – ${fmtDateShort(b.to)})`;
}
function setActiveFy(val){
  ACTIVE_FY = (val===''||val==null) ? null : Number(val);

  if(ACTIVE_FY!=null){
    const b = fyBounds(ACTIVE_FY);

/* ---- Per-statement export helpers ---- */
function statementPlainText(contact, kind){
  const isCust = kind==='customer';
  const biz = S.settings;
  const per = activeStatementPeriod(kind);
  const st = buildStatement(contact, kind, per.from||null, per.to||null);
  const openDocs = (isCust?S.invoices:S.bills).filter(d=>d.contactId===contact.id && d.status!=='draft' && docStatus(d)!=='void' && docBalanceDue(d)>0);
  const aging = agingForDocs(openDocs, per.to||todayStr());
  const cur = biz.currency||'R';
  const money = n => cur + (Number(n)||0).toLocaleString('en-ZA',{minimumFractionDigits:2, maximumFractionDigits:2});
  const pad = (s,n)=> String(s).padEnd(n).slice(0,n);
  const padL = (s,n)=> String(s).padStart(n);
  const lines = [];
  lines.push(`STATEMENT — ${biz.businessName||''}`);
  lines.push(`Date: ${fmtDate(per.to||todayStr())}`);
  if(per.from||per.to) lines.push(`Period: ${per.from?fmtDate(per.from):'start'} - ${per.to?fmtDate(per.to):fmtDate(todayStr())}`);
  if(biz.businessVatNo) lines.push(`VAT: ${biz.businessVatNo}`);
  lines.push('');
  lines.push(`To: ${contact.name}`);
  if(contact.email) lines.push(contact.email);
  lines.push('');
  lines.push(`${pad('Date',12)}${pad('Type',18)}${pad('Reference',14)}${padL('Charge',12)}${padL('Credit',12)}${padL('Balance',12)}`);
  lines.push('-'.repeat(80));
  if(per.from) lines.push(`${pad(fmtDateShort(per.from),12)}${pad('Opening balance',32)}${padL(money(st.openingBalance),12)}`);
  st.rows.forEach(e=>{
    lines.push(`${pad(fmtDateShort(e.date),12)}${pad(e.type,18)}${pad(e.ref,14)}${padL(e.charge?money(e.charge):'',12)}${padL(e.credit?money(e.credit):'',12)}${padL(money(e.balance),12)}`);
  });
  lines.push('-'.repeat(80));
  lines.push('');
  lines.push(`Ageing:  Current ${money(aging.current)}  | 1-30 ${money(aging.d30)}  | 31-60 ${money(aging.d60)}  | 61-90+ ${money(aging.d90)}`);
  lines.push(`Balance ${isCust?'Due':'Owed'}: ${money(st.closingBalance)}`);
  if(biz.bankName) lines.push(`\nPayment to: ${biz.bankName}${biz.bankBranch? ' · Branch '+biz.bankBranch:''}${biz.bankAccountNumber? ' · Acc '+biz.bankAccountNumber:''}`);
  if(biz.invoiceFooterNote) lines.push('\n'+biz.invoiceFooterNote);
  return lines.join('\n');
}
function copyStatementText(contactId, kind){
  const contact = S.contacts.find(c=>c.id===contactId);
  if(!contact) return;
  const text = statementPlainText(contact, kind);
  const done = ()=>showToast('Statement text copied — paste it into an email');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done && done(); }
  catch(e){ showToast('Could not copy automatically'); }
  document.body.removeChild(ta);
}

function emailStatement(contactId, kind){
  const contact = S.contacts.find(c=>c.id===contactId);
  if(!contact || !contact.email){ showToast('No email on file for this contact'); return; }
  const isCust = kind==='customer';
  const per = activeStatementPeriod(kind);
  const st = buildStatement(contact, kind, per.from||null, per.to||null);
  const biz = S.settings;
  const subject = `Statement from ${biz.businessName||'us'} — ${fmtDate(todayStr())}`;
  const cur = biz.currency||'R';
  const bal = cur + (st.closingBalance||0).toLocaleString('en-ZA',{minimumFractionDigits:2, maximumFractionDigits:2});
  const bodyLines = [
    `Dear ${contact.name},`, '',
    `Please find your statement of account as of ${fmtDate(todayStr())} below.`,
    `Balance ${isCust?'due':'owed'}: ${bal}`, '',
    statementPlainText(contact, kind), '',
    `Kind regards,`, biz.businessName||''
  ];
  const mailto = `mailto:${encodeURIComponent(contact.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join('\n'))}`;
  // mailto has length limits; if very long, copy text and open a blank compose instead
  if(mailto.length > 1900){
    copyStatementText(contactId, kind);
    window.location.href = `mailto:${encodeURIComponent(contact.email)}?subject=${encodeURIComponent(subject)}`;
    showToast('Statement copied to clipboard — paste it into the email that just opened');
  } else {
    window.location.href = mailto;
  }
}

function submitContactForm(editId){

function accountGroupOf(type){ return (type==='Income'||type==='Expense') ? 'pl' : 'bs'; }
function accountRangeFor(type){ return accountGroupOf(type)==='pl' ? {min:1000, max:4999, label:'Income Statement'} : {min:5000, max:9999, label:'Balance Sheet'}; }
function codeInRange(code, type){
  const n = parseInt(String(code).replace(/\D/g,''),10);
  if(isNaN(n)) return false;
  const r = accountRangeFor(type);
  return n>=r.min && n<=r.max;
}

/* ============================= VAT REPORT & PERIODS ============================= */
let VAT_VIEW = 'list';       // 'list' | 'detail'
let VAT_DETAIL_ID = null;    // which period's detailed return we're viewing

// Compute the VAT return figures for a date range from the ledger.
function computeVatReturn(from, to){
  // Output VAT (on sales) accumulates as a credit on acc_vatp; Input VAT (on purchases) as a debit on acc_vatr.
  // periodMovement returns the natural-sign movement (liability positive = credit; asset positive = debit).
  const outputVat = periodMovement('acc_vatp', from, to);   // VAT charged on sales (payable to SARS)
  const inputVat = periodMovement('acc_vatr', from, to);    // VAT paid on purchases (claimable)
  // sales/purchases excl. VAT over the period (income credit-normal, expense debit-normal)
  const salesExcl = S.accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+periodMovement(a.id,from,to),0);
  const purchasesExcl = S.accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+periodMovement(a.id,from,to),0);
  const net = round2(outputVat - inputVat); // positive => payable to SARS; negative => refundable
  return {
    outputVat: round2(outputVat), inputVat: round2(inputVat),
    salesExcl: round2(salesExcl), purchasesExcl: round2(purchasesExcl),
    net, payable: net>0 ? net : 0, refundable: net<0 ? -net : 0,
  };
}
function fmtPeriodLabel(from, to){ return fmtDateShort(from)+' – '+fmtDateShort(to); }
function vatPeriodRef(from){
  // e.g. "06/2026" from the END month is conventional; use the 'to' month of the period actually.
  const d = new Date(from+'T00:00:00');
  return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

function renderVatReport(){
  if(VAT_VIEW==='detail'){ renderVatDetail(); return; }
  const body = document.getElementById('report-body');
  const periods = (S.vatPeriods||[]).slice().sort((a,b)=> (b.from||'').localeCompare(a.from||''));
  const openPeriod = periods.find(p=>p.status==='open');
  const closed = periods.filter(p=>p.status==='closed');

  // suggest sensible default dates for a new period: continue after the last period, else this VAT-ish period
  const lastTo = periods.length ? periods.map(p=>p.to).sort().slice(-1)[0] : null;
  let sugFrom, sugTo;
  if(lastTo){
    const d = new Date(lastTo+'T00:00:00'); d.setDate(d.getDate()+1); sugFrom = d.toISOString().slice(0,10);
    const e = new Date(sugFrom+'T00:00:00'); e.setMonth(e.getMonth()+2); e.setDate(0); sugTo = e.toISOString().slice(0,10);
  } else {
    sugFrom = todayStr().slice(0,8)+'01';
    const e = new Date(sugFrom+'T00:00:00'); e.setMonth(e.getMonth()+2); e.setDate(0); sugTo = e.toISOString().slice(0,10);
  }

  let html = '';

  // ---- Current VAT Period and Return ----
  html += `<div class="card" style="margin-bottom:20px;">
    <div class="card-head"><h3>Current VAT Period and Return</h3>${openPeriod? `<button class="btn btn-primary btn-sm" onclick="closeVatPeriod('${openPeriod.id}')">Close VAT Period</button>`:''}</div>`;
  if(openPeriod){
    const r = computeVatReturn(openPeriod.from, openPeriod.to);
    html += `<table><thead><tr><th>Period Status</th><th>Ref</th><th>VAT Period</th><th class="amt">VAT Payable</th><th class="amt">VAT Refundable</th><th>VAT Report</th></tr></thead><tbody>
      <tr>
        <td><span class="badge badge-open">Open</span></td>
        <td class="mono">${vatPeriodRef(openPeriod.from)}</td>
        <td>${fmtPeriodLabel(openPeriod.from, openPeriod.to)}</td>
        <td class="amt num ${r.payable>0?'neg':''}">${r.payable>0?fmt(r.payable):'—'}</td>
        <td class="amt num ${r.refundable>0?'pos':''}">${r.refundable>0?fmt(r.refundable):'—'}</td>
        <td><a class="link-btn" onclick="openVatDetail('${openPeriod.id}')">view</a></td>
      </tr>
    </tbody></table>`;
  } else {
    // opener form
    html += `<div class="card-body">
      <p style="color:var(--text-muted); font-size:13px; margin:0 0 12px;">No VAT period is currently open. Choose the period dates and open one to start tracking this return.</p>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field"><label>Period start</label><input type="date" id="vat-from" value="${sugFrom}"></div>
        <div class="field"><label>Period end</label><input type="date" id="vat-to" value="${sugTo}"></div>
        <div class="field" style="flex:0 0 auto;"><button class="btn btn-primary" onclick="openVatPeriod()">Open VAT Period</button></div>
      </div>
    </div>`;
  }
  html += `</div>`;

  // ---- Previous VAT Periods and Returns ----
  html += `<div class="card">
    <div class="card-head"><h3>Previous VAT Periods and Returns</h3></div>`;
  if(closed.length){
    html += `<table><thead><tr>
      <th>Submission Status</th><th>Period Status</th><th>Ref</th><th>VAT Period</th>
      <th class="amt">VAT Payable</th><th class="amt">VAT Refundable</th><th>VAT Report</th>
    </tr></thead><tbody>
      ${closed.map(p=>{
        const r = computeVatReturn(p.from, p.to);
        return `<tr>
          <td><a class="link-btn" onclick="reopenVatPeriod('${p.id}')">reopen</a></td>
          <td><span class="badge badge-void">Closed</span></td>
          <td class="mono">${vatPeriodRef(p.from)}</td>
          <td>${fmtPeriodLabel(p.from, p.to)}</td>
          <td class="amt num ${r.payable>0?'neg':''}">${r.payable>0?fmt(r.payable):'—'}</td>
          <td class="amt num ${r.refundable>0?'pos':''}">${r.refundable>0?fmt(r.refundable):'—'}</td>
          <td><a class="link-btn" onclick="openVatDetail('${p.id}')">view</a></td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  } else {
    html += `<div class="card-body"><p style="color:var(--text-muted); font-size:13px; margin:0;">No closed VAT periods yet. When you close the current period it will move here, and you can reopen it any time.</p></div>`;
  }
  html += `</div>`;

  body.innerHTML = html;
}

function openVatPeriod(){
  const from = document.getElementById('vat-from').value;
  const to = document.getElementById('vat-to').value;
  if(!from || !to){ showToast('Choose both period dates'); return; }
  if(from > to){ showToast('Start date must be before end date'); return; }
  if((S.vatPeriods||[]).some(p=>p.status==='open')){ showToast('Close the current open period first'); return; }
  // warn on overlap with an existing period
  const overlap = (S.vatPeriods||[]).some(p=> from <= p.to && to >= p.from);
  if(overlap && !confirm('This overlaps an existing VAT period. Open it anyway?')) return;
  S.vatPeriods = S.vatPeriods || [];
  S.vatPeriods.push({ id:uid('vat'), from, to, status:'open', openedAt:todayStr() });
  showToast('VAT period opened');
  saveState(true);
  renderReports();
}
function closeVatPeriod(id){
  const p = (S.vatPeriods||[]).find(x=>x.id===id);
  if(!p) return;
  // warn about uncommitted (draft) cashbook rows dated within this period — they'd be locked before review
  const pendingDrafts = (S.cashbookDrafts||[]).filter(d=> d.date>=p.from && d.date<=p.to).length;
  const r = computeVatReturn(p.from, p.to);
  const msg = r.payable>0 ? `VAT payable of ${fmt(r.payable)}` : (r.refundable>0? `VAT refundable of ${fmt(r.refundable)}` : 'a nil return');
  let warn = '';
  if(pendingDrafts){ warn = `\n\nNote: ${pendingDrafts} unreviewed cashbook transaction${pendingDrafts===1?'':'s'} dated in this period will be LOCKED and can't be reviewed until you reopen the period. Review them first if you want them in this return.`; }
  if(!confirm(`Close this VAT period (${fmtPeriodLabel(p.from,p.to)}) with ${msg}? This locks all cashbook and banking transactions dated in the period. You can reopen it later if needed.${warn}`)) return;
  p.status = 'closed'; p.closedAt = todayStr();
  // snapshot the figures at close so the history is stable even if later entries are backdated
  p.snapshot = r;
  showToast('VAT period closed — transactions in this period are now locked');
  saveState(true);
  renderReports();
}
function reopenVatPeriod(id){
  const p = (S.vatPeriods||[]).find(x=>x.id===id);
  if(!p) return;
  if((S.vatPeriods||[]).some(x=>x.status==='open')){ showToast('Close the current open period before reopening another'); return; }
  if(!confirm(`Reopen the VAT period ${fmtPeriodLabel(p.from,p.to)}?`)) return;
  p.status = 'open'; delete p.closedAt; delete p.snapshot;
  showToast('VAT period reopened');
  saveState(true);
  renderReports();
}
function openVatDetail(id){ VAT_DETAIL_ID = id; VAT_VIEW = 'detail'; renderReports(); }
function backToVatList(){ VAT_VIEW = 'list'; VAT_DETAIL_ID = null; renderReports(); }

// Detailed VAT return breakdown (SARS VAT201-style boxes)
function renderVatDetail(){
  const p = (S.vatPeriods||[]).find(x=>x.id===VAT_DETAIL_ID);
  const body = document.getElementById('report-body');
  if(!p){ backToVatList(); return; }
  const r = computeVatReturn(p.from, p.to);
  const rate = S.settings.taxRate;
  const biz = S.settings;
  body.innerHTML = `
    <div class="card">
      <div class="card-head" style="gap:10px;">
        <div>
          <h3>VAT Return — ${fmtPeriodLabel(p.from, p.to)}</h3>
          <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">Ref ${vatPeriodRef(p.from)} · ${p.status==='open'?'Open':'Closed'}${biz.businessVatNo? ' · VAT No. '+escapeHtml(biz.businessVatNo):''}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="backToVatList()">← Back</button>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">🖶 Print</button>
        </div>
      </div>
      <div class="card-body">
        <div class="section-title">Output tax — sales &amp; income</div>
        <div class="report-row"><span>Standard-rated sales (excl. ${biz.taxLabel})</span><span class="num">${fmt(r.salesExcl)}</span></div>
        <div class="report-row total"><span>Output ${biz.taxLabel} charged (Box 4)</span><span class="num">${fmt(r.outputVat)}</span></div>

        <div class="section-title" style="margin-top:18px;">Input tax — purchases &amp; expenses</div>
        <div class="report-row"><span>Purchases &amp; expenses (excl. ${biz.taxLabel})</span><span class="num">${fmt(r.purchasesExcl)}</span></div>
        <div class="report-row total"><span>Input ${biz.taxLabel} claimed (Box 14)</span><span class="num">${fmt(r.inputVat)}</span></div>

        <div class="report-row total" style="font-size:15px; margin-top:18px; border-top:2px solid var(--border-strong); padding-top:12px;">
          <span>${r.net>=0? `Net ${biz.taxLabel} payable to SARS` : `Net ${biz.taxLabel} refundable`} (Box 20)</span>
          <span class="num ${r.net>0?'neg':(r.net<0?'pos':'')}">${fmt(Math.abs(r.net))}</span>
        </div>
      </div>
      <div class="card-body" style="border-top:1px solid var(--border);">
        <div class="hint" style="margin:0;">Figures are calculated live from ledger entries dated within the period, at the current ${rate}% ${biz.taxLabel} rate. Output ${biz.taxLabel} comes from the VAT Payable (Output) account; input ${biz.taxLabel} from VAT Receivable (Input). Box numbers mirror the SARS VAT201 layout for reference.</div>
      </div>
    </div>`;
}

function saveSettings(){
  S.settings.businessName = document.getElementById('s-name').value.trim() || 'My Business';
  S.settings.currency = document.getElementById('s-currency').value.trim() || 'R';
  S.settings.taxLabel = document.getElementById('s-taxlabel').value.trim() || 'Tax';
  S.settings.taxRate = Number(document.getElementById('s-taxrate').value)||0;
  const fyStart = document.getElementById('s-fystart'); const fyClose = document.getElementById('s-fyclose');
  if(fyStart && fyClose){
    const sv = fyStart.value, cv = fyClose.value;
    if(sv && cv){
      if(cv <= sv){ showToast('Financial year close must be after the start date'); return; }
      // sanity: close should be roughly a year after start (within ~13 months)
      const days = Math.round((new Date(cv)-new Date(sv))/86400000);
      if(days < 300 || days > 400){
        if(!confirm('The start and close dates aren’t about a year apart. Use them anyway?')) return;
      }
      S.settings.fyStartDate = sv;
      S.settings.fyCloseDate = cv;
      S.settings.fyStartMonth = parseInt(sv.slice(5,7),10); // keep legacy field in sync
    }
  }
  S.settings.businessVatNo = document.getElementById('s-vatno').value.trim();
  S.settings.businessAddress = document.getElementById('s-address').value.trim();
  S.settings.bankName = document.getElementById('s-bankname').value.trim();
  S.settings.bankBranch = document.getElementById('s-bankbranch').value.trim();
  S.settings.bankAccountNumber = document.getElementById('s-bankacc').value.trim();
  S.settings.invoiceFooterNote = document.getElementById('s-invnote').value.trim();
  showToast('Settings saved'); saveState(true); render();
}
function handleLogoUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ showToast('That image is quite large — try one under 2MB'); }
  const reader = new FileReader();
  reader.onload = (e)=>{
    S.settings.invoiceLogoDataUrl = String(e.target.result);
    saveState(true);
    showToast('Logo uploaded');
    renderSettings();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function removeInvoiceLogo(){
  S.settings.invoiceLogoDataUrl = '';
  saveState(true);
  renderSettings();
}
async function resetData(){
  if(!confirm('This will erase all current data for this company and reload sample data. Continue?')) return;
  const co = defaultData();
  WORKSPACE.companies[WORKSPACE.activeId] = co;
  S = co;
  seedDemoData();
  await saveState(true);
  showToast('Sample data reloaded');
  navigate('dashboard');
}

/* ============================= MODAL ============================= */
function openModal(title, bodyHtml, actions, wide){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head"><h3>${title}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          ${(actions||[]).map(a=>`<button class="btn ${a.cls}" onclick="${a.onclick}">${a.label}</button>`).join('')}
        </div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================= INIT ============================= */
async function init(){
  await loadState();
  document.getElementById('modal-root').addEventListener('input', (e)=>{
    if(e.target.closest('#li-body-wrap') || e.target.id==='f-tax'){ recalcInvoiceForm(); }
  });
  if(WORKSPACE.authEnabled && (WORKSPACE.users||[]).length>0){
    const sessionId = getSessionUserId();
    const user = sessionId ? WORKSPACE.users.find(u=>u.id===sessionId) : null;
    if(user){
      CURRENT_USER = user;
      ensureActiveCompanyAccessible();
      showApp();
    } else {
      showLoginScreen();
    }
  } else {
    showApp();
  }
}
init();
</script>
