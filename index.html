<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerly — Accounting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpolygon points='60,8 110,106 10,106' fill='none' stroke='%23C9A227' stroke-width='10'/%3E%3Crect x='2' y='64' width='116' height='18' fill='%23C9A227' transform='rotate(-4 60 72)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0F5;
    --ink:#0B0F1D;
    --ink-2:#141B33;
    --surface:#FFFFFF;
    --surface-2:#F4F5F8;
    --accent:#C9A227;
    --accent-dark:#A9841E;
    --money-pos:#1F7A5C;
    --gold:#C9A227;
    --red:#A63B2E;
    --border:#DEE1E8;
    --border-strong:#C3C8D4;
    --text:#15171F;
    --text-muted:#5C6270;
    --text-inverse:#EEF0F5;
    --radius:8px;
    --shadow:0 1px 2px rgba(11,15,29,.06), 0 4px 14px rgba(11,15,29,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; letter-spacing:-0.2px;}
  #shell{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:228px; flex:0 0 228px; background:var(--ink); color:var(--text-inverse);
    display:flex; flex-direction:column; padding:20px 0;
    position:sticky; top:0; height:100vh;
  }
  .brand{ padding:0 20px 18px 20px; border-bottom:1px solid rgba(237,243,238,.12); margin-bottom:10px;}
  .brand-mark{ display:flex; align-items:center; gap:9px;}
  .brand-mark .glyph{ width:30px; height:30px; flex:0 0 30px; display:flex; align-items:center; justify-content:center;}
  .brand-mark .glyph svg{ width:100%; height:100%; }
  .brand-mark .name{font-size:17px; font-weight:600; letter-spacing:.2px;}
  .brand-sub{font-size:10.5px; color:rgba(237,243,238,.5); text-transform:uppercase; letter-spacing:1.4px; margin-top:6px; margin-left:34px;}
  nav{flex:1; padding:10px 12px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:2px;
    border-radius:6px; color:rgba(237,243,238,.72); text-decoration:none; cursor:pointer;
    font-size:13.5px; font-weight:500; border-left:2px solid transparent; transition:background .12s;
  }
  .nav-item:hover{background:rgba(237,243,238,.06); color:var(--text-inverse);}
  .nav-item.active{background:rgba(201,162,39,.16); color:var(--text-inverse); border-left:2px solid var(--gold);}
  .nav-item .ic{width:16px; text-align:center; opacity:.85; font-size:13px;}
  .nav-section-label{font-size:10px; text-transform:uppercase; letter-spacing:1.3px; color:rgba(237,243,238,.35); padding:14px 12px 6px;}
  .nav-parent{ user-select:none; }
  .nav-parent.parent-active{ color:var(--text-inverse); }
  .nav-parent.parent-active .ic{ color:var(--gold); opacity:1; }
  .nav-chev{ font-size:10px; opacity:.6; transition:transform .12s; }
  .nav-children{ margin:2px 0 4px; }
  .nav-subitem{
    padding:7px 12px 7px 38px; margin-bottom:1px; border-radius:6px; cursor:pointer;
    font-size:12.8px; font-weight:500; color:rgba(237,243,238,.62); border-left:2px solid transparent;
    transition:background .12s;
  }
  .nav-subitem:hover{ background:rgba(237,243,238,.06); color:var(--text-inverse); }
  .nav-subitem.active{ background:rgba(201,162,39,.16); color:var(--text-inverse); border-left:2px solid var(--gold); }
  .sidebar-foot{padding:14px 20px; border-top:1px solid rgba(237,243,238,.12); font-size:11px; color:rgba(237,243,238,.4);}
  .co-switch-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(237,243,238,.06); border:1px solid rgba(237,243,238,.14); color:var(--text-inverse);
    border-radius:7px; padding:8px 10px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .co-switch-btn:hover{background:rgba(237,243,238,.11);}
  .co-switch-btn .co-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;}
  .co-switch-btn .chev{color:var(--gold); flex:0 0 auto;}

  /* Main */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    height:60px; flex:0 0 60px; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 26px; position:sticky; top:0; z-index:5;
  }
  #topbar h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.1px;}
  #topbar .sub{font-size:12px; color:var(--text-muted); margin-top:1px;}
  #content{padding:26px; flex:1;}

  /* Buttons */
  .btn{
    font-family:inherit; font-size:13px; font-weight:600; border-radius:6px; border:1px solid transparent;
    padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:filter .1s, background .1s;
  }
  .btn-primary{background:var(--accent); color:var(--ink);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; border-color:var(--border-strong); color:var(--text);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:rgba(166,59,46,.08);}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:4px;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}

  /* Cards / KPIs */
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:14px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); font-weight:600;}
  .kpi .value{font-size:23px; margin-top:8px; font-weight:600;}
  .kpi .delta{font-size:11.5px; margin-top:5px; color:var(--text-muted);}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .card-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
  .card-head h3{margin:0; font-size:14px; font-weight:600;}
  .card-body{padding:14px 18px;}

  /* Tables */
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-muted);
    padding:9px 10px; border-bottom:1px solid var(--border); font-weight:600; white-space:nowrap;
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--surface-2);}
  .amt-right{text-align:right;}
  .pos{color:var(--money-pos);}
  .neg{color:var(--red);}
  td.amt, th.amt{text-align:right;}

  .badge{display:inline-block; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px;}
  .badge-draft{background:#EDEEE9; color:#6B6F63;}
  .badge-open{background:#FCEFD9; color:#8A6212;}
  .badge-partial{background:#E4EEFB; color:#2B5C9A;}
  .badge-paid{background:#E1F1E8; color:var(--money-pos);}
  .badge-void{background:#F7E6E3; color:var(--red);}
  .badge-ob{background:#F3E9D2; color:var(--gold);}

  .empty{padding:40px 20px; text-align:center; color:var(--text-muted);}
  .empty .big{font-size:28px; margin-bottom:8px;}
  .empty p{margin:4px 0 14px; font-size:13px;}

  /* Forms */
  label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px;}
  input,select,textarea{
    width:100%; font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--border-strong);
    border-radius:6px; background:#fff; color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,122,92,.3); border-color:var(--accent);}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .hint{font-size:11px; color:var(--text-muted); margin-top:4px;}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(17,32,26,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:100; overflow:auto;}
  .modal{background:var(--surface); border-radius:10px; width:100%; max-width:560px; box-shadow:0 20px 50px rgba(0,0,0,.25); animation:pop .12s ease-out;}
  .modal.wide{max-width:760px;}
  @keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h3{margin:0; font-size:15px; font-weight:600;}
  .modal-body{padding:20px; max-height:70vh; overflow:auto;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
  .x-close{background:none; border:none; font-size:18px; color:var(--text-muted); cursor:pointer; line-height:1;}

  /* Line items table */
  .li-table th, .li-table td{padding:6px 6px;}
  .li-table input{padding:6px 8px; font-size:13px;}
  .li-total-row td{font-weight:600; border-top:1.5px solid var(--border-strong);}

  .tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab.active{color:var(--accent-dark); border-bottom:2px solid var(--accent);}

  /* Document sub-menu tiles (customer/supplier transactions) */
  .doc-submenu{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .doc-tile{ display:flex; align-items:center; gap:12px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; font-family:inherit; box-shadow:var(--shadow); transition:border-color .12s, transform .06s; }
  .doc-tile:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .doc-tile-ic{ font-size:20px; width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:8px; }
  .doc-tile-body{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .doc-tile-body strong{ font-size:13.5px; color:var(--text); }
  .doc-tile-body span{ font-size:11.5px; color:var(--text-muted); }
  .doc-tile-count{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--accent-dark); background:var(--surface-2); border-radius:20px; padding:2px 10px; }
  @media (max-width: 880px){ .doc-submenu{ grid-template-columns:1fr; } }

  /* Report sub-menu pills */
  .report-submenu{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .param-panel .param-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  .param-panel .field{ margin-bottom:0; }
  @media (max-width: 880px){ .param-panel .param-grid{ grid-template-columns:1fr; } }
  .report-pill{ padding:8px 14px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--border-strong); cursor:pointer; color:var(--text-muted); background:#fff; font-family:inherit; }
  .report-pill:hover{ border-color:var(--accent); color:var(--text); }
  .report-pill.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .statement-card table thead th{ background:transparent; }

  /* Printable statement document */
  .statement-doc{ background:#fff; padding:40px 44px; max-width:780px; margin:0 auto 20px; color:#181818; border:1px solid var(--border); border-radius:8px; }
  .statement-page-break{ page-break-after:always; height:0; }
  .statement-actions{ display:flex; align-items:center; gap:8px; max-width:780px; margin:0 auto 6px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; }
  .statement-actions-name{ font-weight:600; font-size:13px; }
  @media print{
    #sidebar, #topbar, .toolbar, .report-submenu, .no-print { display:none !important; }
    .statement-doc{ border:none; box-shadow:none; max-width:100%; padding:0; margin:0; }
  }

  .balance-check{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 12px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); width:fit-content;}
  .balance-check .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}

  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); font-weight:700; margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .report-row{display:flex; justify-content:space-between; padding:7px 2px; font-size:13.5px; border-bottom:1px dashed var(--border);}
  .report-row.total{font-weight:700; border-bottom:none; border-top:1.5px solid var(--border-strong); margin-top:4px; padding-top:9px;}
  .report-row .lbl{color:var(--text);}
  .indent{padding-left:14px; color:var(--text-muted);}

  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .filter-pills{display:flex; gap:6px;}
  .pill{padding:5px 11px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border-strong); cursor:pointer; color:var(--text-muted); background:#fff;}
  .pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .contact-tag{font-size:11px; padding:2px 7px; border-radius:4px; font-weight:600;}
  .tag-customer{background:#E1F1E8; color:var(--money-pos);}
  .tag-supplier{background:#F0E7F6; color:#6A3D91;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#C9D0C5; border-radius:5px;}
  .toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:200; opacity:0; transform:translateY(8px); transition:all .18s;}
  .toast.show{opacity:1; transform:translateY(0);}

  @media (max-width: 880px){
    #sidebar{position:fixed; left:-228px; z-index:50; transition:left .18s;}
    #sidebar.open{left:0;}
    .grid-4{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
    .field-row, .field-row3{grid-template-columns:1fr;}
    #menu-toggle{display:inline-flex !important;}
  }

  /* Cashbook grid */
  .cashbook-table{ width:100%; border-collapse:collapse; min-width:1080px; }
  .cashbook-table thead th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-muted); padding:8px 6px; border-bottom:1px solid var(--border); font-weight:700; background:var(--surface-2); white-space:nowrap; }
  .cashbook-table tbody td{ padding:5px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
  .cashbook-table input, .cashbook-table select{ font-size:12.5px; padding:6px 7px; width:100%; }
  .cashbook-table input[type=number]{ text-align:right; }
  .cashbook-table select{ color:var(--text); }
  .cashbook-table .cb-actions{ display:flex; gap:4px; padding-top:8px; }
  .cb-add-btn, .cb-del-btn{ width:24px; height:24px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:16px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; line-height:1; }
  .cb-add-btn{ background:var(--money-pos); }
  .cb-add-btn:hover{ background:#155943; }
  .cb-del-btn{ background:var(--red); }
  .cb-del-btn:hover{ filter:brightness(0.9); }
  .cb-undo-btn{ padding:4px 10px; border-radius:6px; border:1px solid var(--border-strong); background:#fff; color:var(--text-muted); cursor:pointer; font-size:11.5px; font-weight:600; font-family:inherit; white-space:nowrap; }
  .cb-undo-btn:hover{ border-color:var(--red); color:var(--red); }
  .cb-page-btn{ min-width:30px; padding:5px 9px; border-radius:6px; border:1px solid var(--border-strong); background:#fff; color:var(--text); cursor:pointer; font-size:12.5px; font-weight:600; font-family:inherit; }
  .cb-page-btn:hover:not(:disabled){ border-color:var(--accent); }
  .cb-page-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .link-btn{ color:var(--accent-dark); cursor:pointer; font-weight:600; text-decoration:none; }
  .link-btn:hover{ text-decoration:underline; }
  .cb-lock{ font-size:14px; opacity:.75; cursor:not-allowed; }
  .cb-locked-row{ background:var(--surface-2); color:var(--text-muted); }
  .cb-locked-row td{ font-style:normal; }
  .cb-page-btn:disabled{ opacity:.4; cursor:default; }
  .invoice-doc{ background:#fff; padding:44px 46px; max-width:780px; margin:0 auto; color:#181818; border:1px solid var(--border); border-radius:8px; }
  .invoice-doc .doc-logo{ max-width:220px; max-height:80px; object-fit:contain; margin-bottom:8px; display:block; }
  .invoice-doc .doc-title{ text-align:right; font-size:19px; letter-spacing:1.2px; margin:0 0 8px; font-weight:700; }
  .invoice-doc .doc-meta table{ margin-left:auto; border-collapse:collapse; }
  .invoice-doc .doc-meta td{ padding:2px 0; font-size:11.5px; }
  .invoice-doc .doc-meta td:first-child{ color:#777; padding-right:16px; text-align:left; }
  .invoice-doc .doc-meta td:last-child{ font-weight:600; text-align:right; }
  .invoice-doc .doc-parties{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:32px 0 22px; padding-top:18px; border-top:1px solid #ddd; }
  .invoice-doc .doc-label{ font-size:9.5px; color:#999; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .invoice-doc .party-name{ font-size:14.5px; font-weight:700; margin:3px 0 6px; }
  .invoice-doc .addr-cols{ display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:11px; color:#333; margin-top:8px; line-height:1.6; }
  .invoice-doc table.doc-items{ width:100%; border-collapse:collapse; margin-top:8px; }
  .invoice-doc table.doc-items th{ text-align:left; font-size:10px; text-transform:uppercase; color:#888; border-bottom:1px solid #ccc; padding:7px 5px; font-weight:600; }
  .invoice-doc table.doc-items td{ padding:9px 5px; font-size:12.5px; border-bottom:1px solid #eee; }
  .invoice-doc table.doc-items .r{ text-align:right; }
  .invoice-doc table.doc-items tbody tr:first-child td{ font-style:italic; }
  .invoice-doc .doc-footer{ display:flex; justify-content:space-between; margin-top:34px; align-items:flex-start; gap:20px; }
  .invoice-doc .doc-bank{ font-size:11.5px; color:#333; line-height:1.8; }
  .invoice-doc .doc-totals{ width:260px; }
  .invoice-doc .doc-totals .row{ display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:#333; }
  .invoice-doc .doc-totals .row.grand{ font-weight:700; color:#111; border-top:1px solid #ccc; margin-top:4px; padding-top:8px; font-size:13.5px; }
  .invoice-doc .doc-balance{ margin-top:18px; text-align:right; }
  .invoice-doc .doc-balance .lbl{ font-size:9.5px; color:#999; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .invoice-doc .doc-balance .amt{ font-size:24px; font-weight:700; }
  @media print{
    @page{ size: A4 portrait; margin: 14mm; }
    #sidebar, #topbar, .toolbar { display:none !important; }
    body{ background:#fff; }
    #main, #content{ padding:0 !important; margin:0 !important; }
    .invoice-doc{ border:none; box-shadow:none; max-width:100%; padding:0; }
  }

  /* Login screen */
  #login-screen{
    position:fixed; inset:0; background:radial-gradient(ellipse at top, #141B33 0%, #0B0F1D 70%);
    display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;
  }
  .login-card{
    background:var(--surface); border-radius:14px; padding:38px 36px 30px; width:100%; max-width:340px;
    text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .login-logo{ width:56px; height:56px; margin:0 auto 14px; }
  .login-logo svg{ width:100%; height:100%; }

/* ============================= PERSISTENCE (multi-company workspace) ============================= */
// Storage adapter: uses the Claude artifact storage API when available,
// and transparently falls back to the browser's localStorage when this
// file is opened on its own (e.g. downloaded and opened directly, or
// hosted elsewhere) so entered data is always kept between sessions.
function hasArtifactStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}
async function storageGet(key){
  if(hasArtifactStorage()){
    try{ return await window.storage.get(key, false); }
    catch(e){ /* not found under this backend — fall through to try local as a safety net */ }
  }
  try{
    const raw = window.localStorage.getItem(key);
    return raw!==null ? {key, value:raw, shared:false} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasArtifactStorage()){
    try{ return await window.storage.set(key, value, false); }
    catch(e){ /* fall through and also try local so we don't silently lose data */ }
  }
  try{
    window.localStorage.setItem(key, value);
    return {key, value, shared:false};
  }catch(e){ return null; }
}
function newCompanyRecord(name){
  const co = defaultData();
  co.settings.businessName = name || 'New Company';
  return co;
}
function migrateCompanyShape(co){
  if(!co) return;
  co.quotes = co.quotes || [];
  co.suppQuotes = co.suppQuotes || [];
  co.creditNotes = co.creditNotes || [];
  co.suppCreditNotes = co.suppCreditNotes || [];
  co.cashbookDrafts = co.cashbookDrafts || [];
  co.cashbookReviewed = co.cashbookReviewed || [];
  co.vatPeriods = co.vatPeriods || [];
  const s = co.settings || (co.settings={});
  if(s.nextQuoteNo==null) s.nextQuoteNo = 3001;
  if(s.nextSuppQuoteNo==null) s.nextSuppQuoteNo = 3501;
  if(s.nextCreditNoteNo==null) s.nextCreditNoteNo = 4001;
  if(s.nextSuppCreditNoteNo==null) s.nextSuppCreditNoteNo = 4501;
  if(s.fyStartMonth==null) s.fyStartMonth = 3;
  if(s.fyStartDate==null) s.fyStartDate = '';
  if(s.fyCloseDate==null) s.fyCloseDate = '';
  // Renumber system accounts to the new ranges (P&L 1000–4999, Balance Sheet 5000–9999) if still on the old scheme.
  if(!co._renumberedV2 && Array.isArray(co.accounts)){
    const newCodes = {
      acc_sales:'1000', acc_other_inc:'1100', acc_unalloc_inc:'1900',
      acc_cos:'2000', acc_office:'3000', acc_rent:'3010', acc_utilities:'3020',
      acc_software:'3030', acc_travel:'3040', acc_bankfees:'3050', acc_unalloc_exp:'3900',
      acc_bank:'5000', acc_ar:'5100', acc_vatr:'5200', acc_ap:'6000', acc_vatp:'6100', acc_equity:'7000',
    };
    co.accounts.forEach(a=>{ if(newCodes[a.id]) a.code = newCodes[a.id]; });
    co._renumberedV2 = true;
  }
  // V3: reserve 5000 = Share Capital, 5200 = Retained Income; move bank/VAT accounts clear.
  if(!co._renumberedV3 && Array.isArray(co.accounts)){
    const move = { acc_bank:'5010', acc_vatr:'9500', acc_vatp:'9600', acc_equity:'5200' };
    co.accounts.forEach(a=>{ if(move[a.id]) a.code = move[a.id]; });
    // rename Owner's Equity -> Retained Income (same account/id, preserves postings)
    const eq = co.accounts.find(a=>a.id==='acc_equity');
    if(eq){ eq.name = 'Retained Income'; eq.type='Equity'; eq.system=true; }
    // add Share Capital at 5000 if it doesn't exist yet
    if(!co.accounts.some(a=>a.id==='acc_share_capital')){
      co.accounts.push({id:'acc_share_capital', code:'5000', name:'Share Capital', type:'Equity', system:true});
    }
    co._renumberedV3 = true;
  }
}
async function loadState(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      WORKSPACE = JSON.parse(res.value);
      if(!WORKSPACE.users) WORKSPACE.users = [];
      if(WORKSPACE.authEnabled === undefined) WORKSPACE.authEnabled = WORKSPACE.users.length>0;
      // migrate any older company records missing the newer document collections
      Object.values(WORKSPACE.companies||{}).forEach(migrateCompanyShape);
      S = WORKSPACE.companies[WORKSPACE.activeId];
      if(S){ LAST_SAVED_AT = new Date(); return; }
    }
  }catch(e){ /* not found or storage unavailable */ }

  // Migrate a legacy single-company save if present
  try{
    const old = await storageGet(OLD_STORAGE_KEY);
    if(old && old.value){
      const co = JSON.parse(old.value);
      const id = uid('co');
      WORKSPACE = { companies:{ [id]: co }, order:[id], activeId:id, users:[], authEnabled:false };
      S = co;
      await saveState(true);
      return;
    }
  }catch(e){ /* none found */ }

  // Fresh install — one seeded sample company
  const id = uid('co');
  const co = newCompanyRecord('My Business');
  WORKSPACE = { companies:{ [id]: co }, order:[id], activeId:id, users:[], authEnabled:false };
  S = co;
  seedDemoData();
  await saveState(true);
}

let LAST_SAVED_AT = null;
/* ---- Save to a real file on disk (File System Access API) ---- */
let FILE_HANDLE = null;          // linked file handle (session)
let FILE_NAME = null;            // display name of linked file
let FILE_SAVE_OK = null;         // last disk-write success flag
function fsApiSupported(){ return typeof window!=='undefined' && 'showSaveFilePicker' in window; }
async function writeWorkspaceToHandle(){
  if(!FILE_HANDLE) return false;
  try{
    const writable = await FILE_HANDLE.createWritable();
    await writable.write(JSON.stringify({ type:'ledgerly-workspace-backup', exportedAt:new Date().toISOString(), workspace:WORKSPACE }, null, 2));
    await writable.close();
    FILE_SAVE_OK = true;
    return true;
  }catch(e){ console.error('disk write failed', e); FILE_SAVE_OK = false; return false; }
}
async function verifyHandlePermission(handle){
  if(!handle) return false;
  const opts = { mode:'readwrite' };
  if((await handle.queryPermission(opts))==='granted') return true;
  if((await handle.requestPermission(opts))==='granted') return true;
  return false;
}
// Link (create or choose) a file to auto-save into.
async function linkSaveFile(){
  if(!fsApiSupported()){ showToast('Your browser doesn’t support saving to a file — use Chrome or Edge on desktop'); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: `ledgerly-${todayStr()}.json`,
      types: [{ description:'Ledgerly data file', accept:{ 'application/json':['.json'] } }],
    });
    if(!(await verifyHandlePermission(handle))){ showToast('Permission to write the file was declined'); return; }
    FILE_HANDLE = handle; FILE_NAME = handle.name;
    await writeWorkspaceToHandle();
    LAST_SAVED_AT = new Date();
    updateSaveIndicator();
    showToast('Linked — Ledgerly will now save to '+FILE_NAME+' as you work');
    if(VIEW==='settings') renderSettings();
  }catch(e){ if(e && e.name!=='AbortError'){ console.error(e); showToast('Could not link the file'); } }
}
// Open an existing Ledgerly file and link it for ongoing saves.
async function openSaveFile(){
  if(!fsApiSupported()){ showToast('Your browser doesn’t support opening a linked file — use Chrome or Edge on desktop'); return; }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description:'Ledgerly data file', accept:{ 'application/json':['.json'] } }],
    });
    if(!(await verifyHandlePermission(handle))){ showToast('Permission to use the file was declined'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    const ws = parsed.workspace || (parsed.companies ? parsed : null);
    if(!ws || !ws.companies){ showToast('That file isn’t a Ledgerly workspace backup'); return; }
    if(!confirm('Load this file and use it for auto-save? Your current in-browser data will be replaced by the file’s contents.')) return;
    WORKSPACE = ws;
    Object.values(WORKSPACE.companies||{}).forEach(migrateCompanyShape);
    if(!WORKSPACE.activeId || !WORKSPACE.companies[WORKSPACE.activeId]) WORKSPACE.activeId = Object.keys(WORKSPACE.companies)[0];
    S = WORKSPACE.companies[WORKSPACE.activeId];
    FILE_HANDLE = handle; FILE_NAME = handle.name;
    await saveState(true); // writes to both localStorage and the file
    showToast('Loaded and linked '+FILE_NAME);
    VIEW='dashboard'; render();
  }catch(e){ if(e && e.name!=='AbortError'){ console.error(e); showToast('Could not open the file'); } }
}
function unlinkSaveFile(){
  FILE_HANDLE = null; FILE_NAME = null; FILE_SAVE_OK = null;
  showToast('Unlinked — still saving in this browser');
  if(VIEW==='settings') renderSettings();
  updateSaveIndicator();
}
async function saveState(immediate){
  clearTimeout(SAVE_TIMER);
  const doSave = async ()=>{
    try{
      const result = await storageSet(STORAGE_KEY, JSON.stringify(WORKSPACE));
      // also mirror to the linked disk file, if any
      if(FILE_HANDLE) await writeWorkspaceToHandle();
      if(result || FILE_HANDLE){ LAST_SAVED_AT = new Date(); updateSaveIndicator(); }
      else { showToast('Could not save — changes may not persist'); }
    }catch(e){ console.error('save failed', e); showToast('Could not save — changes may not persist'); }
  };
  if(immediate) return doSave();
  SAVE_TIMER = setTimeout(doSave, 250);
}
function updateSaveIndicator(){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(!LAST_SAVED_AT){ el.textContent = 'Not saved yet'; return; }
  const secs = Math.round((Date.now()-LAST_SAVED_AT.getTime())/1000);
  const when = secs<5 ? 'just now' : secs<60 ? secs+'s ago' : Math.round(secs/60)+'m ago';
  if(FILE_HANDLE){
    el.innerHTML = `● Saved ${when} <span title="Saving to ${escapeHtml(FILE_NAME||'file')}" style="color:var(--money-pos);">→ 💾 ${escapeHtml(FILE_NAME||'file')}</span>`;
  } else {
    el.textContent = '● Saved '+when;
  }
}
setInterval(updateSaveIndicator, 15000);

/* ============================= BACKUP / RESTORE ============================= */
function downloadJson(obj, filename){
  const data = JSON.stringify(obj, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportWorkspaceBackup(){
  downloadJson({ type:'ledgerly-workspace-backup', exportedAt: new Date().toISOString(), workspace: WORKSPACE },
    `ledgerly-backup-${todayStr()}.json`);
  showToast('Backup downloaded');
}
function exportCompanyBackup(){
  const safeName = (S.settings.businessName||'company').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  downloadJson({ type:'ledgerly-company-backup', exportedAt: new Date().toISOString(), company: S },
    `ledgerly-${safeName || 'company'}-${todayStr()}.json`);
  showToast('Company backup downloaded');
}
function handleRestoreBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let parsed;
    try{ parsed = JSON.parse(String(e.target.result)); }
    catch(err){ showToast('That file is not valid JSON'); event.target.value=''; return; }

    // Restoring a single-company export: add it as a new company, don't touch the rest of the workspace
    if(parsed && parsed.type==='ledgerly-company-backup' && parsed.company){
      if(!confirm(`Add "${parsed.company.settings?.businessName || 'this company'}" as a new company from the backup file?`)){ event.target.value=''; return; }
      const id = uid('co');
      WORKSPACE.companies[id] = parsed.company;
      (WORKSPACE.order = WORKSPACE.order || Object.keys(WORKSPACE.companies)).push(id);
      WORKSPACE.activeId = id;
      S = WORKSPACE.companies[id];
      await saveState(true);
      showToast('Company restored from backup');
      navigate('dashboard');
      event.target.value = '';
      return;
    }

    // Restoring a full workspace export: replace everything
    let newWorkspace = null;
    if(parsed && parsed.type==='ledgerly-workspace-backup' && parsed.workspace){ newWorkspace = parsed.workspace; }
    else if(parsed && parsed.companies && parsed.activeId){ newWorkspace = parsed; } // raw workspace object, no wrapper
    if(!newWorkspace || !newWorkspace.companies){
      showToast("This file doesn't look like a Ledgerly backup");
      event.target.value = '';
      return;
    }
    if(!confirm('Restoring this backup will replace ALL companies and data currently in this app. This cannot be undone. Continue?')){ event.target.value=''; return; }
    WORKSPACE = newWorkspace;
    if(!WORKSPACE.order) WORKSPACE.order = Object.keys(WORKSPACE.companies);
    if(!WORKSPACE.activeId || !WORKSPACE.companies[WORKSPACE.activeId]) WORKSPACE.activeId = WORKSPACE.order[0];
    S = WORKSPACE.companies[WORKSPACE.activeId];
    await saveState(true);
    showToast('Backup restored');
    navigate('dashboard');
    event.target.value = '';
  };
  reader.readAsText(file);
}


function companyList(){
  const all = (WORKSPACE.order||Object.keys(WORKSPACE.companies)).map(id=>({id, name:WORKSPACE.companies[id].settings.businessName}));
  if(!WORKSPACE.authEnabled || !CURRENT_USER || CURRENT_USER.isAdmin) return all;
  const allowed = new Set(CURRENT_USER.companyIds||[]);
  return all.filter(c=>allowed.has(c.id));
}
function canManageWorkspace(){
  return !WORKSPACE.authEnabled || (CURRENT_USER && CURRENT_USER.isAdmin);
}
function switchCompany(id){
  if(!WORKSPACE.companies[id]) return;
  if(WORKSPACE.authEnabled && CURRENT_USER && !CURRENT_USER.isAdmin && !(CURRENT_USER.companyIds||[]).includes(id)){
    showToast("You don't have access to that company"); return;
  }
  WORKSPACE.activeId = id;
  S = WORKSPACE.companies[id];
  closeModal();
  saveState(true);
  navigate('dashboard');
}
function openCompanySwitcher(){
  const list = companyList();
  const canManage = canManageWorkspace();
  const rows = list.map(c=>`
    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border); border-radius:7px; margin-bottom:8px; ${c.id===WORKSPACE.activeId?'background:var(--surface-2); border-color:var(--accent);':''}">

let CURRENT_USER = null;
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

function submitUserForm(editId){
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value;
  const password2 = document.getElementById('u-password2').value;
  const isAdmin = document.getElementById('u-admin').checked;
  const companyIds = Array.from(document.querySelectorAll('.u-company-cb:checked')).map(el=>el.value);
  if(!username){ showToast('Enter a username'); return; }
  WORKSPACE.users = WORKSPACE.users || [];
  const dupe = WORKSPACE.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==editId);
  if(dupe){ showToast('That username is already taken'); return; }
  if(password || password2){
    if(password !== password2){ showToast('Passwords do not match'); return; }
  }
  if(!isAdmin && companyIds.length===0){ showToast('Give this user access to at least one company, or make them an administrator'); return; }

  if(editId){
    const u = WORKSPACE.users.find(x=>x.id===editId);
    u.username = username;
    u.isAdmin = isAdmin;
    u.companyIds = isAdmin ? [] : companyIds;
    if(password) u.passwordHash = simpleHash(password);
    if(CURRENT_USER && CURRENT_USER.id===u.id) CURRENT_USER = u;
  } else {
    if(!password){ showToast('Set a password for the new user'); return; }
    const newUser = { id:uid('usr'), username, passwordHash:simpleHash(password), isAdmin, companyIds: isAdmin? [] : companyIds };
    const wasOpenAccess = !WORKSPACE.authEnabled;
    WORKSPACE.users.push(newUser);
    WORKSPACE.authEnabled = true;
    if(wasOpenAccess){ CURRENT_USER = newUser; setSessionUserId(newUser.id); }
  }
  closeModal(); showToast('User saved'); saveState(true); updateSessionIndicator(); render();
}
function deleteUserAction(id){
  const u = (WORKSPACE.users||[]).find(x=>x.id===id);
  if(!u) return;
  const remainingAdmins = WORKSPACE.users.filter(x=>x.isAdmin && x.id!==id);
  if(u.isAdmin && remainingAdmins.length===0){ showToast('You need at least one administrator'); return; }
  if(!confirm(`Delete the user "${u.username}"? This cannot be undone.`)) return;

    showToast('Your account was removed — signing out');
    signOut();
  } else {
    showToast('User deleted');
    render();
  }
}

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

/* ============================= JOURNAL / LEDGER ENGINE ============================= */
function postJournal(description, date, lines){
  lines.forEach(l=>{ if(!l.id) l.id = uid('jl'); });
  const totalDebit = lines.reduce((s,l)=>s+(l.debit||0),0);
  const totalCredit = lines.reduce((s,l)=>s+(l.credit||0),0);
  const entry = {id:uid('je'), date, description, lines, ref:null};
  S.journal.push(entry);
  return entry;
}
function reverseJournalByRef(ref){
  const toReverse = S.journal.filter(e=>e.ref===ref);
  toReverse.forEach(e=>{
    postJournal('Reversal: '+e.description, todayStr(), e.lines.map(l=>({accountId:l.accountId, debit:l.credit, credit:l.debit})));
  });
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function accountType(id){ const a=S.accounts.find(x=>x.id===id); return a?a.type:null; }
function accountNormalIsDebit(type){ return type==='Asset'||type==='Expense'; }

function getAccountBalance(accountId, asOfDate, excludeOpening){
  let debit=0, credit=0;
  S.journal.forEach(e=>{
    if(asOfDate && e.date>asOfDate) return;
    if(excludeOpening && e.isOpeningBalance) return;
    e.lines.forEach(l=>{ if(l.accountId===accountId){ debit+=l.debit||0; credit+=l.credit||0; } });
  });
  const type = accountType(accountId);
  return accountNormalIsDebit(type) ? (debit-credit) : (credit-debit);
}
function periodMovement(accountId, from, to){
  let debit=0, credit=0;
  S.journal.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    e.lines.forEach(l=>{ if(l.accountId===accountId){ debit+=l.debit||0; credit+=l.credit||0; } });
  });
  const type = accountType(accountId);
  return accountNormalIsDebit(type) ? (debit-credit) : (credit-debit);
}
// A date is locked if it falls within any CLOSED VAT period.
function isDateInClosedVatPeriod(date){
  if(!date) return false;
  return (S.vatPeriods||[]).some(p=> p.status==='closed' && date>=p.from && date<=p.to);
}
function lockedVatPeriodFor(date){
  return (S.vatPeriods||[]).find(p=> p.status==='closed' && date>=p.from && date<=p.to);
}

/* ============================= INVOICES ============================= */
function lineSubtotal(line){ return (Number(line.qty)||0) * (Number(line.price)||0); }
function docSubtotal(doc){ return doc.lines.reduce((s,l)=>s+lineSubtotal(l),0); }
function docTax(doc){ return doc.taxRate>0 ? docSubtotal(doc)*doc.taxRate/100 : 0; }
function invoiceTotal(doc){ return docSubtotal(doc)+docTax(doc); }
function billTotal(doc){ return docSubtotal(doc)+docTax(doc); }
function docPaidAmount(doc){ return (doc.payments||[]).reduce((s,p)=>s+p.amount,0); }
function docBalanceDue(doc){ return round2(invoiceTotal(doc)-docPaidAmount(doc)); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

function docStatus(doc){
  if(doc.status==='draft') return 'draft';
  if(doc.status==='void') return 'void';
  const bal = round2(invoiceTotal(doc)-docPaidAmount(doc));
  if(bal<=0.004) return 'paid';
  if(docPaidAmount(doc)>0) return 'partial';
  return 'open';
}

function makeInvoiceObj(contactId, date, dueDate, lines, useTax){
  const num = 'INV-'+(S.settings.nextInvoiceNo++);
  return {id:uid('inv'), number:num, contactId, date, dueDate, lines:lines.map(l=>({id:uid('li'),...l})), taxRate: useTax?S.settings.taxRate:0, status:'draft', payments:[], notes:''};
}
function makeBillObj(contactId, date, dueDate, lines, useTax){
  const num = 'BILL-'+(S.settings.nextBillNo++);
  return {id:uid('bill'), number:num, contactId, date, dueDate, lines:lines.map(l=>({id:uid('li'),...l})), taxRate: useTax?S.settings.taxRate:0, status:'draft', payments:[], notes:''};
}

function issueInvoice(invId, dateOverride){
  const inv = S.invoices.find(i=>i.id===invId);
  if(!inv || inv.status!=='draft') return;
  const date = dateOverride||todayStr();
  const lines = [{accountId:'acc_ar', debit:invoiceTotal(inv), credit:0}];
  inv.lines.forEach(l=>{ lines.push({accountId:l.accountId, debit:0, credit:lineSubtotal(l)}); });
  const tax = docTax(inv);
  if(tax>0) lines.push({accountId:'acc_vatp', debit:0, credit:tax});
  const entry = postJournal('Invoice '+inv.number+' issued to '+contactName(inv.contactId), date, lines);
  entry.ref = 'inv-issue-'+inv.id;
  inv.status='open'; inv.issueRef=entry.ref; inv.date=date;
}
function issueBill(billId, dateOverride){
  const bill = S.bills.find(b=>b.id===billId);
  if(!bill || bill.status!=='draft') return;
  const date = dateOverride||todayStr();
  const lines = [];
  bill.lines.forEach(l=>{ lines.push({accountId:l.accountId, debit:lineSubtotal(l), credit:0}); });
  const tax = docTax(bill);
  if(tax>0) lines.push({accountId:'acc_vatr', debit:tax, credit:0});
  lines.push({accountId:'acc_ap', debit:0, credit:billTotal(bill)});
  const entry = postJournal('Bill '+bill.number+' received from '+contactName(bill.contactId), date, lines);
  entry.ref = 'bill-issue-'+bill.id;
  bill.status='open'; bill.issueRef=entry.ref; bill.date=date;
}
function recordInvoicePayment(invId, amount, date, bankAccountId, refOverride){
  const inv = S.invoices.find(i=>i.id===invId);
  if(!inv) return;
  amount = Math.min(amount, docBalanceDue(inv));
  if(amount<=0) return;
  const entry = postJournal('Payment received for '+inv.number, date, [
    {accountId:bankAccountId, debit:amount, credit:0},
    {accountId:'acc_ar', debit:0, credit:amount},
  ]);
  entry.ref = refOverride || ('inv-pay-'+uid('p'));
  inv.payments.push({id:uid('pay'), date, amount, bankAccountId, journalRef:entry.ref});
}
function recordBillPayment(billId, amount, date, bankAccountId, refOverride){
  const bill = S.bills.find(b=>b.id===billId);
  if(!bill) return;
  amount = Math.min(amount, docBalanceDue(bill));
  if(amount<=0) return;
  const entry = postJournal('Payment made for '+bill.number, date, [
    {accountId:'acc_ap', debit:amount, credit:0},
    {accountId:bankAccountId, debit:0, credit:amount},
  ]);
  entry.ref = refOverride || ('bill-pay-'+uid('p'));
  bill.payments.push({id:uid('pay'), date, amount, bankAccountId, journalRef:entry.ref});
}
function voidInvoice(invId){
  const inv = S.invoices.find(i=>i.id===invId);
  if(!inv) return;
  (inv.payments||[]).forEach(p=>reverseJournalByRef(p.journalRef));
  if(inv.issueRef) reverseJournalByRef(inv.issueRef);
  inv.status='void'; inv.payments=[];
}
function voidBill(billId){
  const bill = S.bills.find(b=>b.id===billId);
  if(!bill) return;
  (bill.payments||[]).forEach(p=>reverseJournalByRef(p.journalRef));
  if(bill.issueRef) reverseJournalByRef(bill.issueRef);
  bill.status='void'; bill.payments=[];
}
function contactName(id){ const c=S.contacts.find(x=>x.id===id); return c?c.name:'—'; }

/* ============================= QUOTES (non-posting until converted) ============================= */
// Customer quotes (sales) and supplier quotes (purchase) share this shape.
function makeQuoteObj(kind, contactId, date, expiryDate, lines, useTax){
  const isCust = kind==='customer';
  const num = (isCust? 'QUO-'+(S.settings.nextQuoteNo++) : 'PQ-'+(S.settings.nextSuppQuoteNo++));
  return {id:uid('quo'), kind, number:num, contactId, date, dueDate:expiryDate,
    lines:lines.map(l=>({id:uid('li'),...l})), taxRate: useTax?S.settings.taxRate:0,
    status:'draft', payments:[], notes:'', convertedToId:null};
}
function quoteCollection(kind){ return kind==='customer' ? S.quotes : S.suppQuotes; }
function markQuoteSent(quoteId, kind){
  const q = quoteCollection(kind).find(x=>x.id===quoteId);
  if(!q || q.status!=='draft') return;
  q.status='open'; // "sent / awaiting acceptance"
}
function convertQuoteToDoc(quoteId, kind){
  const coll = quoteCollection(kind);
  const q = coll.find(x=>x.id===quoteId);
  if(!q || q.convertedToId) return null;
  const useTax = (q.taxRate||0) > 0;
  const plainLines = q.lines.map(l=>({desc:l.desc, qty:l.qty, price:l.price, accountId:l.accountId}));
  let newDoc;
  if(kind==='customer'){
    const due = new Date(); due.setDate(due.getDate()+14);
    newDoc = makeInvoiceObj(q.contactId, todayStr(), due.toISOString().slice(0,10), plainLines, useTax);
    S.invoices.push(newDoc);
    issueInvoice(newDoc.id, todayStr());
  } else {
    const due = new Date(); due.setDate(due.getDate()+30);
    newDoc = makeBillObj(q.contactId, todayStr(), due.toISOString().slice(0,10), plainLines, useTax);
    S.bills.push(newDoc);
    issueBill(newDoc.id, todayStr());
  }
  q.status='converted'; q.convertedToId=newDoc.id;
  return newDoc;
}

/* ============================= CREDIT NOTES (post real ledger reversals) ============================= */
// Customer credit note reduces what a customer owes (reverses income + AR + output VAT).
// Supplier credit note reduces what you owe a supplier (reverses expense + AP + input VAT).
function makeCreditNoteObj(kind, contactId, date, lines, useTax, appliesToId){
  const isCust = kind==='customer';
  const num = (isCust? 'CN-'+(S.settings.nextCreditNoteNo++) : 'SCN-'+(S.settings.nextSuppCreditNoteNo++));
  return {id:uid('cn'), kind, number:num, contactId, date, dueDate:date,
    lines:lines.map(l=>({id:uid('li'),...l})), taxRate: useTax?S.settings.taxRate:0,
    status:'draft', payments:[], notes:'', appliesToId:appliesToId||null};
}
function creditNoteCollection(kind){ return kind==='customer' ? S.creditNotes : S.suppCreditNotes; }
function issueCreditNote(cnId, kind, dateOverride){
  const coll = creditNoteCollection(kind);
  const cn = coll.find(x=>x.id===cnId);
  if(!cn || cn.status!=='draft') return;
  const date = dateOverride||todayStr();
  const tax = docTax(cn);
  const lines = [];
  if(kind==='customer'){
    // reverse of an invoice: debit income (reduce), debit output VAT, credit AR
    cn.lines.forEach(l=>{ lines.push({accountId:l.accountId, debit:lineSubtotal(l), credit:0}); });
    if(tax>0) lines.push({accountId:'acc_vatp', debit:tax, credit:0});
    lines.push({accountId:'acc_ar', debit:0, credit:invoiceTotal(cn)});
  } else {
    // reverse of a bill: debit AP, credit expense (reduce), credit input VAT
    lines.push({accountId:'acc_ap', debit:billTotal(cn), credit:0});
    cn.lines.forEach(l=>{ lines.push({accountId:l.accountId, debit:0, credit:lineSubtotal(l)}); });
    if(tax>0) lines.push({accountId:'acc_vatr', debit:0, credit:tax});
  }
  const who = contactName(cn.contactId);
  const entry = postJournal('Credit note '+cn.number+(kind==='customer'?' to ':' from ')+who, date, lines);
  entry.ref = 'cn-issue-'+cn.id;
  cn.status='open'; cn.issueRef=entry.ref; cn.date=date;

  // If applied to a specific open invoice/bill, allocate the credit against its balance
  if(cn.appliesToId){
    const targetColl = kind==='customer' ? S.invoices : S.bills;
    const target = targetColl.find(d=>d.id===cn.appliesToId);
    if(target){
      const alloc = Math.min(creditNoteTotal(cn), docBalanceDue(target));
      if(alloc>0){
        // record as a non-cash "payment" that clears part of the balance, offset within AR/AP already handled above,
        // so this is a memo allocation: reduce the target's balance via a payment entry that nets AR/AP to itself.
        const clrEntry = postJournal('Credit note '+cn.number+' applied to '+target.number, date,
          kind==='customer'
            ? [{accountId:'acc_ar', debit:alloc, credit:0},{accountId:'acc_ar', debit:0, credit:alloc}]
            : [{accountId:'acc_ap', debit:alloc, credit:0},{accountId:'acc_ap', debit:0, credit:alloc}]);
        clrEntry.ref = 'cn-apply-'+uid('a');
        target.payments = target.payments||[];
        target.payments.push({id:uid('pay'), date, amount:alloc, bankAccountId:null, journalRef:clrEntry.ref, creditNoteId:cn.id, memo:'Credit note '+cn.number});
      }
    }
  }
}
function creditNoteTotal(cn){ return invoiceTotal(cn); } // same subtotal+tax math
function voidCreditNote(cnId, kind){
  const cn = creditNoteCollection(kind).find(x=>x.id===cnId);
  if(!cn) return;
  // reverse any allocation payments recorded against target docs
  const targetColl = kind==='customer' ? S.invoices : S.bills;
  if(cn.appliesToId){
    const target = targetColl.find(d=>d.id===cn.appliesToId);
    if(target && target.payments){
      target.payments.filter(p=>p.creditNoteId===cn.id).forEach(p=>reverseJournalByRef(p.journalRef));
      target.payments = target.payments.filter(p=>p.creditNoteId!==cn.id);
    }
  }
  if(cn.issueRef) reverseJournalByRef(cn.issueRef);
  cn.status='void';
}

/* ============================= FORMAT HELPERS ============================= */
function fmt(n){
  n = Number(n)||0;
  const neg = n < -0.001;
  const abs = Math.abs(n);
  const str = abs.toLocaleString('en-ZA',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg? '−':'') + S.settings.currency + str;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateShort(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit', month:'short'});
}

function renderNav(){
  const nav = document.getElementById('nav');
  // keep the group of the current view open
  const activeGroup = NAV_GROUP_OF[VIEW];
  if(activeGroup) NAV_OPEN_GROUPS[activeGroup] = true;
  nav.innerHTML = NAV.map(item=>{
    if(item.sec) return `<div class="nav-section-label">${item.sec}</div>`;
    if(item.group){
      const open = !!NAV_OPEN_GROUPS[item.group];
      const parentActive = NAV_GROUP_OF[VIEW]===item.group;
      const childrenHtml = item.children.map(ch=>
        `<div class="nav-subitem ${(VIEW===ch.id || NAV_CHILD_ALIAS[VIEW]===ch.id)?'active':''}" onclick="navigate('${ch.id}')">${ch.label}</div>`
      ).join('');
      return `<div class="nav-group ${open?'open':''}">
        <div class="nav-item nav-parent ${parentActive?'parent-active':''}" onclick="toggleNavGroup('${item.group}')">
          <span class="ic">${item.ic}</span><span style="flex:1;">${item.label}</span><span class="nav-chev">${open?'▾':'▸'}</span>
        </div>
        <div class="nav-children" style="${open?'':'display:none;'}">${childrenHtml}</div>
      </div>`;
    }
    return `<div class="nav-item ${VIEW===item.id?'active':''}" onclick="navigate('${item.id}')"><span class="ic">${item.ic}</span>${item.label}</div>`;
  }).join('');
}
function toggleNavGroup(group){
  NAV_OPEN_GROUPS[group] = !NAV_OPEN_GROUPS[group];
  renderNav();
}
function navigate(view){
  VIEW = view;
  const g = NAV_GROUP_OF[view];
  if(g) NAV_OPEN_GROUPS[g] = true;
  document.getElementById('sidebar').classList.remove('open');
  render();
}
function setTopbar(title, sub, actionsHtml){
  document.getElementById('page-title').textContent = title;

  const t = document.getElementById('toast');

  clearTimeout(t._timer);

}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const fy = activeFyBounds();
  setTopbar('Dashboard', S.settings.businessName + (fy? ` · FY${ACTIVE_FY}`:''), '');
  // balances: as-of the FY end when a year is selected, else current
  const asOf = fy ? fy.to : undefined;
  const bank = getAccountBalance('acc_bank', asOf);
  const ar = getAccountBalance('acc_ar', asOf);
  const ap = getAccountBalance('acc_ap', asOf);
  // profit: over the active FY (start→end), else month-to-date
  const profFrom = fy ? fy.from : todayStr().slice(0,8)+'01';
  const profTo = fy ? fy.to : todayStr();
  const profLabel = fy ? `FY${ACTIVE_FY}` : 'MTD';
  const incomeMTD = S.accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+periodMovement(a.id, profFrom, profTo),0);
  const expenseMTD = S.accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+periodMovement(a.id, profFrom, profTo),0);

  const totalDebits = S.journal.reduce((s,e)=>s+e.lines.reduce((a,l)=>a+(l.debit||0),0),0);
  const totalCredits = S.journal.reduce((s,e)=>s+e.lines.reduce((a,l)=>a+(l.credit||0),0),0);
  const balanced = Math.abs(totalDebits-totalCredits) < 0.01;

  // recent/overdue: within FY when active
  const invPool = fy ? S.invoices.filter(i=> i.date>=fy.from && i.date<=fy.to) : S.invoices;
  const recentInvoices = [...invPool].filter(i=>i.status!=='draft').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const overdue = S.invoices.filter(i=>docStatus(i)!=='paid' && i.status==='open' && i.dueDate < todayStr());

  document.getElementById('content').innerHTML = `
    ${fy? `<div class="hint" style="margin-bottom:14px;">Showing <strong>FY${ACTIVE_FY}</strong> (${fmtDateShort(fy.from)} – ${fmtDateShort(fy.to)}). Balances are as at ${fmtDateShort(fy.to)}. Switch years in the top bar; you can still edit any transaction.</div>`:''}
    <div class="grid-4">
      <div class="kpi"><div class="label">Bank Balance</div><div class="value num">${fmt(bank)}</div><div class="delta">${fy? 'As at '+fmtDateShort(fy.to):'Business Bank Account'}</div></div>
      <div class="kpi"><div class="label">Owed to you</div><div class="value num">${fmt(ar)}</div><div class="delta">Accounts Receivable</div></div>
      <div class="kpi"><div class="label">You owe</div><div class="value num">${fmt(ap)}</div><div class="delta">Accounts Payable</div></div>
      <div class="kpi"><div class="label">Net profit (${profLabel})</div><div class="value num ${(incomeMTD-expenseMTD)>=0?'pos':'neg'}">${fmt(incomeMTD-expenseMTD)}</div><div class="delta">Income ${fmt(incomeMTD)} · Expenses ${fmt(expenseMTD)}</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Recent sales activity</h3><span class="btn btn-ghost btn-sm" onclick="navigate('sales')">View all</span></div>
        <div class="card-body" style="padding:0;">
          ${recentInvoices.length? `<table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th class="amt">Amount</th><th>Status</th></tr></thead><tbody>
            ${recentInvoices.map(i=>`<tr class="clickable" onclick="openInvoiceDetail('${i.id}')">
              <td class="mono">${i.number}</td><td>${contactName(i.contactId)}</td><td>${fmtDateShort(i.date)}</td>
              <td class="amt num">${fmt(invoiceTotal(i))}</td><td>${statusBadge(docStatus(i))}</td></tr>`).join('')}
          </tbody></table>` : `<div class="empty"><p>No invoices issued yet.</p></div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Books integrity</h3></div>
        <div class="card-body">
          <div class="balance-check"><span class="dot" style="background:${balanced?'var(--money-pos)':'var(--red)'}"></span>
            ${balanced? 'Books balanced ✓' : 'Out of balance!'}</div>
          <div style="margin-top:14px; font-size:12.5px; color:var(--text-muted); line-height:1.7;">
            Total debits <span class="num" style="color:var(--text);">${fmt(totalDebits)}</span><br>
            Total credits <span class="num" style="color:var(--text);">${fmt(totalCredits)}</span>
          </div>
          <div class="section-title">Overdue invoices</div>
          ${overdue.length? overdue.map(i=>`<div class="report-row"><span>${i.number} — ${contactName(i.contactId)}</span><span class="num neg">${fmt(docBalanceDue(i))}</span></div>`).join('')
            : `<div style="font-size:12.5px; color:var(--text-muted);">Nothing overdue.</div>`}
        </div>
      </div>
    </div>
  `;
}
function statusBadge(s){
  const map = {draft:'Draft', open:'Open', partial:'Partial', paid:'Paid', void:'Void'};
  return `<span class="badge badge-${s}">${map[s]||s}</span>`;
}

function openInvoiceForm(){
  if(S.contacts.filter(c=>c.type==='customer').length===0){
    showToast('Add a customer first');
    openContactForm('customer');
    return;
  }
  const customers = S.contacts.filter(c=>c.type==='customer');
  const incomeAccounts = S.accounts.filter(a=>a.type==='Income');
  const today = todayStr();
  const due = new Date(); due.setDate(due.getDate()+14);
  const dueStr = due.toISOString().slice(0,10);
  const lineRow = (idx)=>`
    <tr data-row="${idx}">
      <td><input type="text" class="li-desc" placeholder="Description"></td>
      <td style="width:64px;"><input type="number" class="li-qty" value="1" min="0" step="1"></td>
      <td style="width:100px;"><input type="number" class="li-price" value="0" min="0" step="0.01"></td>
      <td style="width:150px;"><select class="li-acct">${incomeAccounts.map(a=>`<option value="${a.id}">${a.code} ${a.name}</option>`).join('')}</select></td>
      <td style="width:90px; text-align:right;" class="li-line-total num">${S.settings.currency}0.00</td>
      <td style="width:30px;"><button class="icon-btn" onclick="this.closest('tr').remove(); recalcInvoiceForm();">✕</button></td>
    </tr>`;
  const body = `
    <div class="field-row">
      <div class="field"><label>Customer</label><select id="f-contact">${customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>Invoice date</label><input type="date" id="f-date" value="${today}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Due date</label><input type="date" id="f-due" value="${dueStr}"></div>
      <div class="field"><label>Apply ${S.settings.taxLabel} (${S.settings.taxRate}%)</label>
        <select id="f-tax"><option value="1">Yes</option><option value="0">No</option></select></div>
    </div>
    <div class="section-title">Line items</div>
    <table class="li-table" id="li-body-wrap">
      <thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Income account</th><th class="amt">Total</th><th></th></tr></thead>
      <tbody id="li-body">${lineRow(0)}</tbody>
    </table>
    <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="document.getElementById('li-body').insertAdjacentHTML('beforeend', document.getElementById('li-tmpl').innerHTML); recalcInvoiceForm();">+ Add line</button>
    <template id="li-tmpl">${lineRow('x').replace(/data-row="x"/,'data-row="x"')}</template>
    <div style="margin-top:18px; border-top:1px solid var(--border); padding-top:12px;">
      <div class="report-row"><span>Subtotal</span><span class="num" id="sum-sub">${S.settings.currency}0.00</span></div>
      <div class="report-row"><span>${S.settings.taxLabel}</span><span class="num" id="sum-tax">${S.settings.currency}0.00</span></div>
      <div class="report-row total"><span>Total</span><span class="num" id="sum-total">${S.settings.currency}0.00</span></div>
    </div>
  `;
  openModal('New Invoice', body, [
    {label:'Save as draft', cls:'btn-ghost', onclick:`submitInvoiceForm(false)`},
    {label:'Save & issue', cls:'btn-primary', onclick:`submitInvoiceForm(true)`},
  ], true);
  recalcInvoiceForm();
}
function recalcInvoiceForm(){
  const rows = document.querySelectorAll('#li-body tr');
  let sub = 0;
  rows.forEach(r=>{
    const qty = Number(r.querySelector('.li-qty').value)||0;
    const price = Number(r.querySelector('.li-price').value)||0;
    const t = qty*price;
    sub += t;
    r.querySelector('.li-line-total').textContent = fmt(t);
  });
  const taxOn = document.getElementById('f-tax') ? document.getElementById('f-tax').value==='1' : false;
  const tax = taxOn ? sub*S.settings.taxRate/100 : 0;
  if(document.getElementById('sum-sub')) document.getElementById('sum-sub').textContent = fmt(sub);
  if(document.getElementById('sum-tax')) document.getElementById('sum-tax').textContent = fmt(tax);
  if(document.getElementById('sum-total')) document.getElementById('sum-total').textContent = fmt(sub+tax);
}
function collectLines(descSel,qtySel,priceSel,acctSel){
  const rows = document.querySelectorAll('#li-body tr');
  const lines = [];
  rows.forEach(r=>{
    const desc = r.querySelector(descSel).value.trim();
    const qty = Number(r.querySelector(qtySel).value)||0;
    const price = Number(r.querySelector(priceSel).value)||0;
    const accountId = r.querySelector(acctSel).value;
    if(desc || qty || price) lines.push({desc: desc||'Item', qty, price, accountId});
  });
  return lines;
}
function submitInvoiceForm(issueNow){
  const contactId = document.getElementById('f-contact').value;
  const date = document.getElementById('f-date').value;
  const due = document.getElementById('f-due').value;
  const taxOn = document.getElementById('f-tax').value==='1';
  const lines = collectLines('.li-desc','.li-qty','.li-price','.li-acct');
  if(lines.length===0){ showToast('Add at least one line item'); return; }
  const inv = makeInvoiceObj(contactId, date, due, lines, taxOn);
  S.invoices.push(inv);
  if(issueNow) issueInvoice(inv.id, date);
  closeModal();
  showToast(issueNow? 'Invoice issued' : 'Invoice saved as draft');
  navigate('sales');
}

function openInvoiceDetail(id){
  const inv = S.invoices.find(i=>i.id===id);
  if(!inv) return;
  const status = docStatus(inv);
  const rows = inv.lines.map(l=>`<tr><td>${l.desc}</td><td class="amt num">${l.qty}</td><td class="amt num">${fmt(l.price)}</td><td class="amt num">${fmt(lineSubtotal(l))}</td></tr>`).join('');
  const paymentsRows = (inv.payments||[]).map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${S.accounts.find(a=>a.id===p.bankAccountId)?.name||''}</td><td class="amt num">${fmt(p.amount)}</td></tr>`).join('');
  const body = `
    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
      <div><div style="font-size:12px; color:var(--text-muted);">Customer</div><strong>${contactName(inv.contactId)}</strong></div>
      <div style="text-align:right;">${statusBadge(status)}<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">Issued ${inv.status==='draft'?'—':fmtDate(inv.date)} · Due ${fmtDate(inv.dueDate)}</div></div>
    </div>
    <table><thead><tr><th>Description</th><th class="amt">Qty</th><th class="amt">Price</th><th class="amt">Total</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:14px; padding-top:10px; border-top:1px solid var(--border);">
      <div class="report-row"><span>Subtotal</span><span class="num">${fmt(docSubtotal(inv))}</span></div>
      <div class="report-row"><span>${S.settings.taxLabel}</span><span class="num">${fmt(docTax(inv))}</span></div>
      <div class="report-row total"><span>Total</span><span class="num">${fmt(invoiceTotal(inv))}</span></div>
      ${status!=='draft' && status!=='void' ? `<div class="report-row"><span>Paid</span><span class="num pos">${fmt(docPaidAmount(inv))}</span></div>
      <div class="report-row"><span>Balance due</span><span class="num ${docBalanceDue(inv)>0?'neg':''}">${fmt(docBalanceDue(inv))}</span></div>` : ''}
    </div>
    ${paymentsRows? `<div class="section-title">Payments</div><table><thead><tr><th>Date</th><th>Into</th><th class="amt">Amount</th></tr></thead><tbody>${paymentsRows}</tbody></table>`:''}
  `;
  const actions = [{label:'Print / Save as PDF', cls:'btn-ghost', onclick:`openInvoicePrintView('${inv.id}')`}];
  if(status==='draft'){
    actions.push({label:'Delete draft', cls:'btn-danger', onclick:`deleteInvoice('${inv.id}')`});
    actions.push({label:'Issue invoice', cls:'btn-primary', onclick:`issueInvoiceAction('${inv.id}')`});
  } else if(status==='open' || status==='partial'){
    actions.push({label:'Void', cls:'btn-danger', onclick:`voidInvoiceAction('${inv.id}')`});
    actions.push({label:'Record payment', cls:'btn-primary', onclick:`openInvoicePaymentForm('${inv.id}')`});
  } else if(status==='paid'){
    actions.push({label:'Void', cls:'btn-danger', onclick:`voidInvoiceAction('${inv.id}')`});
  }

/* ============================= BANKING ============================= */
function getBankLinesForAccount(accountId){
  const out = [];
  S.journal.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.accountId===accountId){
        if(!l.id) l.id = uid('jl'); // lazy-migrate older entries that predate line ids
        out.push({entryId:e.id, lineId:l.id, date:e.date, desc:e.description, debit:l.debit||0, credit:l.credit||0, reconciled: !!l.reconciled});
      }
    });
  });
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.lineId.localeCompare(b.lineId));
}
function lastReconciliation(accountId){
  const list = S.reconciliations.filter(r=>r.accountId===accountId).sort((a,b)=>a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  return list.length ? list[list.length-1] : null;
}

/* ============================= BANK RECONCILIATION ============================= */
let RECON = null; // {accountId, opening, closing, statementDate, ticks:{lineId:bool}}
function openReconcile(accountId){
  const last = lastReconciliation(accountId);
  RECON = {
    accountId,
    opening: last ? last.closingBalance : 0,
    closing: last ? last.closingBalance : 0,
    statementDate: todayStr(),
    ticks: {},
  };
  VIEW = 'reconcile';
  render();
}
function reconUnclearedLines(){
  return getBankLinesForAccount(RECON.accountId).filter(l=>!l.reconciled);
}
function reconTotals(){
  const lines = reconUnclearedLines();
  let inTotal=0, outTotal=0;
  lines.forEach(l=>{ if(RECON.ticks[l.lineId]){ inTotal+=l.debit; outTotal+=l.credit; } });
  const calcClosing = round2(RECON.opening + inTotal - outTotal);
  const diff = round2(calcClosing - RECON.closing);
  return {inTotal, outTotal, calcClosing, diff};
}

function toggleReconLine(lineId, checked){

function recalcRecon(){
  const t = reconTotals();
  const set = (id, val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
  set('rc-sum-open', fmt(RECON.opening));
  set('rc-sum-in', fmt(t.inTotal));
  set('rc-sum-out', fmt(t.outTotal));
  set('rc-sum-calc', fmt(t.calcClosing));
  set('rc-sum-target', fmt(RECON.closing));
  const balanced = Math.abs(t.diff) < 0.005;
  const dot = document.querySelector('#rc-balance-check .dot');
  const label = document.getElementById('rc-diff-label');
  if(dot) dot.style.background = balanced ? 'var(--money-pos)' : 'var(--red)';
  if(label) label.textContent = balanced ? 'Balanced ✓' : `Difference: ${fmt(Math.abs(t.diff))}`;
}
function finishReconciliation(){
  const lines = reconUnclearedLines();
  const tickedIds = lines.filter(l=>RECON.ticks[l.lineId]).map(l=>l.lineId);
  if(tickedIds.length===0){ showToast('Tick at least one transaction'); return; }
  const t = reconTotals();
  if(Math.abs(t.diff) >= 0.005){
    if(!confirm(`This reconciliation is out of balance by ${fmt(Math.abs(t.diff))}. Finish anyway?`)) return;
  }
  const reconId = uid('rc');
  S.journal.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.accountId===RECON.accountId && tickedIds.includes(l.id)){ l.reconciled = true; l.reconciledId = reconId; }
    });
  });
  S.reconciliations.push({
    id: reconId, accountId: RECON.accountId, date: RECON.statementDate,
    openingBalance: RECON.opening, closingBalance: RECON.closing, clearedCount: tickedIds.length,
  });
  const cleared = tickedIds.length;
  RECON = null;
  showToast(`Reconciliation complete — ${cleared} transaction${cleared===1?'':'s'} cleared`);
  navigate('banking');
}

function guessCategoryForDesc(desc, isIn){
  const lower = desc.toLowerCase();
  for(const h of FEED_CATEGORY_HINTS){ if(h.kw.some(k=>lower.includes(k))) return h.accountId; }
  return isIn ? 'acc_other_inc' : 'acc_office';
}
function randomDateBetween(from, to){
  const f = new Date(from+'T00:00:00'), t = new Date(to+'T00:00:00');
  if(f>=t) return to;
  const rand = new Date(f.getTime() + Math.random()*(t-f));
  return rand.toISOString().slice(0,10);
}
function fetchFeedTransactions(accountId){
  S.bankFeeds = S.bankFeeds || {};
  S.feedInbox = S.feedInbox || [];
  const feed = S.bankFeeds[accountId];
  if(!feed) return 0;
  const fromDate = feed.lastFetched || daysAgo(14);
  const count = 3 + Math.floor(Math.random()*4);
  const openInvoices = S.invoices.filter(i=>{ const st=docStatus(i); return st==='open'||st==='partial'; });
  const openBills = S.bills.filter(b=>{ const st=docStatus(b); return st==='open'||st==='partial'; });
  let added = 0;
  for(let i=0;i<count;i++){
    let desc, amount, isIn, matchType=null, matchId=null;
    const roll = Math.random();
    if(roll<0.22 && openInvoices.length){
      const inv = openInvoices[Math.floor(Math.random()*openInvoices.length)];
      desc = 'EFT Payment Received - '+contactName(inv.contactId);
      amount = docBalanceDue(inv); isIn = true; matchType='invoice'; matchId=inv.id;
    } else if(roll<0.38 && openBills.length){
      const bill = openBills[Math.floor(Math.random()*openBills.length)];
      desc = 'Payment Sent - '+contactName(bill.contactId);
      amount = docBalanceDue(bill); isIn = false; matchType='bill'; matchId=bill.id;
    } else {
      const t = FEED_SAMPLE_TXNS[Math.floor(Math.random()*FEED_SAMPLE_TXNS.length)];
      desc = t.desc; isIn = !t.out; amount = round2(t.min + Math.random()*(t.max-t.min));
    }
    if(amount<=0) continue;
    const date = randomDateBetween(fromDate, todayStr());
    S.feedInbox.push({
      id:uid('fd'), accountId, date, desc, amount:round2(amount), isIn,
      matchType, matchId, included:true, categoryOverride:null,
      categoryId: matchType? null : guessCategoryForDesc(desc, isIn),
    });
    added++;
  }
  feed.lastFetched = todayStr();
  return added;
}

let CSV_IMPORT = null; // {headers, dataRows, bankAccountId, defaultCategoryId, mapping:{dateIdx,descIdx,amountIdx,debitIdx,creditIdx,mode}, parsedRows}

function parseCSV(text){
  const rows = []; let field='', row=[], inQuotes=false;
  text = text.replace(/^\uFEFF/, ''); // strip BOM
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field+=ch;
    } else {
      if(ch==='"') inQuotes=true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(ch==='\r'){ /* skip, \n handles line break */ }
      else field+=ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c=>String(c).trim()!==''));
}
function guessColumn(headers, candidates){
  const lower = headers.map(h=>String(h).toLowerCase().trim());
  for(const cand of candidates){
    const idx = lower.findIndex(h=>h===cand);
    if(idx>-1) return idx;
  }
  for(const cand of candidates){
    const idx = lower.findIndex(h=>h.includes(cand));
    if(idx>-1) return idx;
  }
  return -1;
}
function parseDateFlexible(str){
  if(!str) return null;
  str = String(str).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let [_, d, mo, y] = m;
    if(y.length===2) y = (Number(y)<70?'20':'19')+y;
    d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
    return `${y}-${mo}-${d}`;
  }
  const parsed = new Date(str);
  if(!isNaN(parsed.getTime())) return parsed.toISOString().slice(0,10);
  return null;
}

  CSV_IMPORT = { bankAccountId: bankAccounts[0]?.id, defaultCategoryId: '' }; // '' => Unallocated holding
  const body = `

function handleCsvFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const rows = parseCSV(String(e.target.result));
    if(rows.length<2){ showToast('Could not find any rows in that file'); return; }
    CSV_IMPORT.headers = rows[0];
    CSV_IMPORT.dataRows = rows.slice(1);
    const h = CSV_IMPORT.headers;
    CSV_IMPORT.mapping = {
      dateIdx: guessColumn(h, ['date','transaction date','posted date','value date']),
      descIdx: guessColumn(h, ['description','narrative','details','memo','payee','reference','transaction']),
      amountIdx: guessColumn(h, ['amount','value','net amount']),
      debitIdx: guessColumn(h, ['debit','money out','withdrawal','paid out','out']),
      creditIdx: guessColumn(h, ['credit','money in','deposit','paid in','in']),
      mode: 'signed',
    };
    if(CSV_IMPORT.mapping.amountIdx===-1 && (CSV_IMPORT.mapping.debitIdx>-1 || CSV_IMPORT.mapping.creditIdx>-1)){
      CSV_IMPORT.mapping.mode = 'split';
    }
    if(CSV_IMPORT.mapping.dateIdx===-1) CSV_IMPORT.mapping.dateIdx = 0;
    if(CSV_IMPORT.mapping.descIdx===-1) CSV_IMPORT.mapping.descIdx = Math.min(1, h.length-1);
    if(CSV_IMPORT.mapping.amountIdx===-1 && CSV_IMPORT.mapping.mode==='signed') CSV_IMPORT.mapping.amountIdx = h.length-1;
    renderCsvMapping();
  };
  reader.readAsText(file);
}

      </div>
    `}

function computeCsvParsedRows(){
  const map = CSV_IMPORT.mapping;
  const defCat = CSV_IMPORT.defaultCategoryId;
  const prev = CSV_IMPORT.parsedRows || [];
  CSV_IMPORT.parsedRows = CSV_IMPORT.dataRows.map((row, i)=>{
    const date = parseDateFlexible(row[map.dateIdx]);
    const desc = (row[map.descIdx]||'').trim() || 'Imported transaction';
    let amount;
    if(map.mode==='signed'){
      amount = parseFloat(String(row[map.amountIdx]||'0').replace(/[, ]/g,'')) || 0;
    } else {
      const cr = parseFloat(String(row[map.creditIdx]||'0').replace(/[, ]/g,'')) || 0;
      const dr = parseFloat(String(row[map.debitIdx]||'0').replace(/[, ]/g,'')) || 0;
      amount = cr - dr;
    }
    const existing = prev[i];
    return {
      idx:i, date, desc, amount,
      allocType: existing ? existing.allocType : 'account',   // 'account' | 'contact'
      categoryId: existing ? existing.categoryId : defCat,     // nominal account when allocType==='account'
      contactId: existing ? existing.contactId : null,         // chosen customer/supplier
      matchDocId: existing ? existing.matchDocId : null,       // chosen invoice/bill
      include: existing ? existing.include : (!!date && amount!==0),
    };
  });
}

  CSV_IMPORT.defaultCategoryId = id;
  if(CSV_IMPORT.parsedRows) CSV_IMPORT.parsedRows.forEach(r=>{ if(r.allocType==='account') r.categoryId=id; });
  updateCsvPreview();
}

    const openDocs = isIn
      ? S.invoices.filter(i=>i.contactId===r.contactId && ['open','partial'].includes(docStatus(i)))
      : S.bills.filter(b=>b.contactId===r.contactId && ['open','partial'].includes(docStatus(b)));
    return `
      <select style="margin-bottom:4px;" onchange="setCsvRowContact(${r.idx}, this.value)">
        <option value="">${isIn?'Customer':'Supplier'}…</option>

      </select>
      ${r.contactId? `<select onchange="setCsvRowMatch(${r.idx}, this.value)">
        <option value="">${isIn?'Invoice':'Bill'}…</option>
        ${openDocs.map(d=>`<option value="${d.id}" ${d.id===r.matchDocId?'selected':''}>${d.number} (${fmt(docBalanceDue(d))} due)</option>`).join('')}
      </select>` : (contacts.length===0? `<div class="hint" style="margin:0;">No ${isIn?'customers':'suppliers'} yet</div>`:'')}

    ${categoryAccounts.map(a=>`<option value="${a.id}" ${a.id===r.categoryId?'selected':''}>${a.code} ${a.name}</option>`).join('')}
  </select>`;
}
function updateCsvPreview(){
  computeCsvParsedRows();
  const rows = CSV_IMPORT.parsedRows;
  const wrap = document.getElementById('csv-preview-wrap');
  if(!wrap) return;
  const totalIn = rows.filter(r=>r.include && r.amount>0).reduce((s,r)=>s+r.amount,0);
  const totalOut = rows.filter(r=>r.include && r.amount<0).reduce((s,r)=>s+Math.abs(r.amount),0);
  const includedCount = rows.filter(r=>r.include).length;
  wrap.innerHTML = `
    <div class="section-title">Preview — ${includedCount} of ${rows.length} selected · in ${fmt(totalIn)} · out ${fmt(totalOut)}</div>
    <div style="max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:6px;">
    <table><thead><tr><th style="width:28px;"></th><th>Date</th><th>Description</th><th class="amt">Amount</th></tr></thead><tbody>
      ${rows.map(r=>`<tr style="${r.date?'':'opacity:.5;'}">
        <td><input type="checkbox" ${r.include?'checked':''} ${r.date?'':'disabled'} onchange="CSV_IMPORT.parsedRows[${r.idx}].include=this.checked; updateCsvSummary();"></td>
        <td>${r.date? fmtDateShort(r.date) : '<span class="neg">invalid date</span>'}</td>
        <td>${escapeHtml(r.desc)}</td>
        <td class="amt num ${r.amount>=0?'pos':'neg'}">${fmt(r.amount)}</td>
      </tr>`).join('')}
    </tbody></table>
    </div>
    <div class="hint" style="margin-top:8px;">Tick the rows to import. They'll land in the <strong>Cashbook</strong>, where you set the Type and allocate each one to an account or an open invoice/bill before committing.</div>
  `;
}
function updateCsvSummary(){
  const rows = CSV_IMPORT.parsedRows;
  const totalIn = rows.filter(r=>r.include && r.amount>0).reduce((s,r)=>s+r.amount,0);
  const totalOut = rows.filter(r=>r.include && r.amount<0).reduce((s,r)=>s+Math.abs(r.amount),0);
  const includedCount = rows.filter(r=>r.include).length;
  const title = document.querySelector('#csv-preview-wrap .section-title');
  if(title) title.textContent = `Preview — ${includedCount} of ${rows.length} selected · in ${fmt(totalIn)} · out ${fmt(totalOut)}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function confirmCsvImport(){
  if(!CSV_IMPORT || !CSV_IMPORT.parsedRows || !CSV_IMPORT.parsedRows.length){ showToast('Choose a CSV file first'); return; }
  const bank = CSV_IMPORT.bankAccountId;
  const rows = CSV_IMPORT.parsedRows.filter(r=>r.include && r.date && r.amount!==0);
  if(!rows.length){ showToast('No transactions selected to import'); return; }
  // Convert each imported row into a Cashbook draft row so it can be allocated in the
  // full cashbook grid (Account/Contact, VAT, Selection) before being committed to the books.
  S.cashbookDrafts = S.cashbookDrafts || [];
  rows.forEach(r=>{
    const draft = blankCashbookRow(bank);
    draft.date = r.date;
    draft.description = r.desc;
    // preserve any allocation already chosen in the preview
    draft.type = r.allocType || 'account';
    if(r.amount>0) draft.received = Math.abs(r.amount);
    else draft.spent = Math.abs(r.amount);
    if(draft.type==='account'){
      draft.accountSelection = r.categoryId || null; // null => Unallocated holding account
    } else {
      draft.contactSelection = r.contactId || null;
      draft.matchDocId = r.matchDocId || null;
    }
    S.cashbookDrafts.push(draft);
  });
  const count = rows.length;
  CSV_IMPORT = null;
  CASHBOOK_ACCOUNT = bank;
  closeModal();
  saveState(true);
  showToast(`${count} transaction${count===1?'':'s'} sent to the Cashbook — allocate and add them`);
  navigate('cashbook');
}
